<meta name="description" content="The SDAIA Academy training catalog and learning paths: 37 interlocking programs across a beginner level, a shared foundation core, and the AI Engineer and Data Scientist tracks. كاتالوج أكاديمية سدايا التدريبي والمسارات التعليمية.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<script src="../assets/sdaia-ui.js"></script>
<style>
/* =========================================================
   SDAIA Academy — Learning Catalog · page styles
   (builds on the shared design system in ../assets/sdaia-ui.css)
   ========================================================= */
.sec-num{font-family:var(--font-mono);font-size:12px;color:var(--accent-ink);font-weight:600;margin-inline-end:.4rem}

/* pathways */
#trackgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.track-card{padding:1.5rem 1.6rem}
.track-card__head{display:flex;align-items:center;gap:12px;margin-bottom:1rem}
.track-card__head .sd-iconbox{background:var(--tc);color:#fff}
.track-card__head h3{font-size:1.15rem;line-height:1.25}
.track-card__head .cnt{font-size:12.5px;color:var(--ink-3);display:block;margin-top:2px}
.track-card > p{margin-bottom:1rem}
.track-rows{display:grid;gap:.55rem;font-size:14px}
.track-rows .r{display:flex;gap:9px;align-items:flex-start}
.track-rows .r .i{width:16px;height:16px;color:var(--tc);margin-top:.25em}
.track-rows .r b{color:var(--ink);font-weight:600}
.track-rows .r span{color:var(--ink-2)}

/* levels */
.level-card{padding:1.5rem 1.6rem}
.level-card__top{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:.9rem}
.level-card .lv-n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--tc);color:#fff;font-weight:700;font-size:15px}
.level-card .sd-bar{margin-bottom:.9rem}
.level-card h3{font-size:1.15rem}
.level-card > p{margin:.5rem 0 1rem}
.level-card .counts{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.level-card .cred{display:flex;gap:9px;font-size:13.5px;color:var(--ink-2);padding-top:.9rem;border-top:1px solid var(--line);margin-top:auto}
.level-card .cred .i{color:var(--accent);width:17px;height:17px;margin-top:.2em}

/* journey */
.journey-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1.25rem;margin-bottom:1.5rem}
.journey-head .sd-section__head{margin-bottom:0}
.progress-card{display:flex;align-items:center;gap:1rem;padding:.9rem 1.2rem;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-xs)}
.progress-card svg{flex:none}
.ring-bg{stroke:var(--surface-3)}
.ring-fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.progress-card .pct{font-size:1.5rem;font-weight:700;color:var(--brand-ink);line-height:1.1}
html[data-theme="dark"] .progress-card .pct{color:#fff}
.progress-card .pl{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.rail-wrap{overflow-x:auto;padding:.3rem 0 .8rem;margin-bottom:1.25rem;scrollbar-width:thin}
.rail{display:flex;align-items:center;gap:4px;min-width:max-content;padding-inline:2px}
.rail .conn{height:2px;width:20px;background:var(--line-2);flex:none}
.railnode{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink-3);flex:none;transition:all .25s;font-variant-numeric:tabular-nums}
.railnode:hover{border-color:var(--brand);color:var(--brand)}
.railnode.is-done{background:var(--ok);border-color:var(--ok);color:#fff}
.railnode.is-active{background:var(--tc);border-color:var(--tc);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 22%,transparent)}
.railnode .i{width:15px;height:15px;stroke-width:2.4}
.step-card{padding:1.8rem 1.9rem}
.step-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.2rem}
.step-id{display:flex;align-items:flex-start;gap:14px;min-width:0}
.step-id .sd-iconbox{background:var(--tc);color:#fff;width:50px;height:50px;border-radius:14px}
.step-tags{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.4rem}
.step-code{font-family:var(--font-mono);font-weight:600;font-size:13px;color:color-mix(in srgb,var(--tc) 80%,#000)}
html[data-theme="dark"] .step-code{color:color-mix(in srgb,var(--tc) 45%,#fff)}
.step-card h3{font-size:clamp(1.2rem,2vw,1.5rem);line-height:1.3}
.step-card > p.desc{font-size:15px;color:var(--ink-2);max-width:80ch;margin-bottom:1.4rem}
.step-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:.75rem;margin-bottom:1.5rem}
.step-meta .m{background:var(--surface-3);border-radius:var(--r-md);padding:.8rem .95rem}
.step-meta .m .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:.25rem}
.step-meta .m .k .i{width:14px;height:14px}
.step-meta .m .v{font-size:14px;font-weight:500;color:var(--ink);line-height:1.5}
.step-cols{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
@media(max-width:800px){.step-cols{grid-template-columns:1fr}}
.step-cols h4{font-size:14.5px;display:flex;align-items:center;gap:8px;margin-bottom:.7rem;color:var(--brand-ink)}
html[data-theme="dark"] .step-cols h4{color:#fff}
.step-cols h4 .i{width:16px;height:16px;color:var(--accent)}
.check-list{list-style:none;display:grid;gap:.45rem;font-size:14px;color:var(--ink-2)}
.check-list li{display:flex;gap:8px;align-items:flex-start}
.check-list li .i{width:16px;height:16px;color:var(--ok);margin-top:.22em;flex:none}
.step-more{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--line)}
@media(max-width:800px){.step-more{grid-template-columns:1fr}}
.step-more h4{font-size:13.5px;margin-bottom:.45rem;color:var(--brand-ink)}
html[data-theme="dark"] .step-more h4{color:#fff}
.step-more p{font-size:14px;color:var(--ink-2)}
.step-more .blk + .blk{margin-top:1rem}
.stack-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:12.5px;margin-top:.6rem}
.stack-row .sd-tag{font-weight:600}.stack-row .sd-tag .mono{font-weight:600}
.stack-row .i{width:14px;height:14px;color:var(--ink-3)}
.journey-nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:1.4rem;flex-wrap:wrap}
.journey-nav .pos{font-size:13.5px;color:var(--ink-3)}
.journey-nav .pos b{color:var(--ink)}

/* catalog grid */
.cat-filters{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin-bottom:1.5rem}
.cat-filters .sd-search{flex:1 1 240px;max-width:380px;margin-inline-start:auto}
.prog-card{padding:1.35rem 1.4rem}
.prog-card__top{display:flex;align-items:flex-start;justify-content:space-between;gap:.7rem;margin-bottom:.8rem}
.prog-card__top .sd-iconbox{background:var(--tc);color:#fff;width:40px;height:40px;border-radius:11px}
.prog-card .code{font-family:var(--font-mono);font-size:12px;font-weight:600;color:color-mix(in srgb,var(--tc) 80%,#000);direction:ltr}
html[data-theme="dark"] .prog-card .code{color:color-mix(in srgb,var(--tc) 45%,#fff)}
/* per-track tag: readable tint in both themes */
.tag-track{background:color-mix(in srgb,var(--tk) 14%,transparent);color:color-mix(in srgb,var(--tk) 75%,#000)}
html[data-theme="dark"] .tag-track{color:color-mix(in srgb,var(--tk) 45%,#fff)}
.prog-card h3{font-size:1.05rem;line-height:1.35;margin-bottom:.5rem}
.prog-card .tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.75rem}
.prog-card .tags .sd-tag{font-size:11.5px;padding:.12rem .6rem}
.prog-card .desc{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prog-card .cardtog{margin-top:.8rem;display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;color:var(--brand);align-self:flex-start}
.prog-card .cardtog .i{width:16px;height:16px;transition:transform .25s}
.prog-card .cardtog[aria-expanded="true"] .i{transform:rotate(180deg)}
.expandable{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.expandable.open{grid-template-rows:1fr}
.expandable > div{overflow:hidden;visibility:hidden;transition:visibility .4s} /* keep collapsed links out of the tab order */
.expandable.open > div{visibility:visible}
.exp-body{padding-top:1rem;margin-top:.8rem;border-top:1px solid var(--line);display:grid;gap:.8rem;font-size:13.5px}
.exp-body .lbl{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.3rem}
html[lang="ar"] .exp-body .lbl{letter-spacing:0;text-transform:none;font-size:12.5px}
.exp-body ul{list-style:none;display:grid;gap:.3rem;color:var(--ink-2)}
.exp-body ul li{display:flex;gap:6px}
.exp-body ul li::before{content:"•";color:var(--accent)}
.exp-body .two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.exp-body p{color:var(--ink-2);font-size:13px}
.open-step{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--brand)}
.open-step .i{width:14px;height:14px}

/* matrix */
.matrix-card{padding:.75rem;overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:2px;font-size:12px}
table.mx th,table.mx td{padding:0}
table.mx thead th{height:104px;vertical-align:bottom;padding-bottom:6px}
table.mx thead th > span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--font-mono);font-weight:600;font-size:11px;color:var(--brand);display:inline-block;direction:ltr}
table.mx .fam{position:sticky;inset-inline-start:0;background:var(--surface);padding:.45rem .7rem;text-align:start;font-weight:600;min-width:190px;white-space:nowrap;z-index:1;color:var(--ink)}
table.mx td .cell{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;font-weight:700;font-family:var(--font-mono);background:var(--surface-2)}
table.mx td .cell.I{background:var(--brand-soft);color:var(--brand)}
table.mx td .cell.D{background:var(--blue-400);color:#05203D}
table.mx td .cell.M{background:var(--navy-800);color:#fff}
html[data-theme="dark"] table.mx td .cell.M{background:#CFE3F7;color:#06162B}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:.8rem}
.legend .cell{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-weight:700;font-family:var(--font-mono);font-size:11px;margin-inline-end:6px;vertical-align:middle}

/* naming + recs */
.design-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
@media(max-width:900px){.design-grid{grid-template-columns:1fr}}
.naming-card{padding:1.6rem 1.7rem}
.naming-card .code-ex{font-family:var(--font-mono);font-size:1.35rem;font-weight:600;color:var(--brand);margin-bottom:1.1rem;direction:ltr;text-align:start;letter-spacing:.02em}
.naming-card .code-ex .t1{color:var(--accent-ink)}.naming-card .code-ex .t2{color:var(--green-600)}.naming-card .code-ex .t3{color:var(--ink-3)}
.naming-rows{display:grid;gap:.7rem;font-size:14px}
.naming-rows .r{display:flex;gap:10px;align-items:flex-start}
.naming-rows .r .k{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:.2rem .5rem;flex:none;min-width:56px;text-align:center;margin-top:.1em;direction:ltr}
.naming-rows .r span{color:var(--ink-2)}
.recs{display:grid;gap:.8rem}
.rec{display:flex;gap:12px;padding:1rem 1.15rem}
.rec b{display:block;font-size:14.5px;color:var(--ink)}
.rec p{font-size:13.5px;margin-top:.15rem}

@media(max-width:640px){.step-card{padding:1.3rem 1.2rem}.journey-nav .pos{order:-1;width:100%;text-align:center}}
</style>
</head>

</section>

<nav class="sd-subnav" data-spy data-ar-label="أقسام الكاتالوج" data-en-label="Catalog sections" style="margin-top:2rem">
  <div class="sd-container sd-subnav__inner" id="navlinks"></div>
</nav>

<!-- TRACKS -->
<section class="sd-section" id="tracks">
  <div class="sd-container">
    <div class="sd-section__head">
      <div class="sd-eyebrow"><span class="sec-num">01</span><span data-ar="المسارات" data-en="Pathways"></span></div>
      <h2 data-ar="أربعة مسارات: مستوى تمهيدي مفتوح، وأساس مشترك، ومساران مهنيان" data-en="Four pathways: an open beginner tier, a shared core, two role tracks"></h2>

        <h2 data-ar="رحلة التعلّم التراكمية" data-en="Stackable Learning Journey"></h2>
        <p data-ar="تنقّل عبر الكاتالوج بالتسلسل. كل برنامج يضيف شهادة تتراكم نحو شهادة المسار المهنية. يُحفظ تقدّمك في هذا المتصفح." data-en="Step through the catalog in sequence. Each program stacks a credential toward the Track Professional Certificate. Your progress is saved in this browser."></p>
      </div>
      <div class="progress-card" role="group" data-ar-label="تقدّم الرحلة" data-en-label="Journey progress">
        <svg width="78" height="78" viewBox="0 0 86 86" style="transform:rotate(-90deg)" aria-hidden="true">
          <circle class="ring-bg" cx="43" cy="43" r="36" fill="none" stroke-width="8"/>

      <span class="pos"><span data-ar="الخطوة" data-en="Step"></span> <b class="num"><span id="stepnum">1</span> / <span id="steptotal">37</span></b></span>
      <button id="nextBtn" class="sd-btn sd-btn--primary"><span data-ar="التالي" data-en="Next"></span><svg class="i i-flip" aria-hidden="true" focusable="false"><use href="#i-arrow-right"/></svg></button>
    </div>
  </div>
</section>

<!-- CATALOG -->
<section class="sd-section sd-section--alt" id="catalog">
  <div class="sd-container">
    <div class="sd-section__head">
      <div class="sd-eyebrow"><span class="sec-num">04</span><span data-ar="الكاتالوج" data-en="Catalog"></span></div>
      <h2 data-ar="الكاتالوج الكامل للبرامج" data-en="The full program catalog"></h2>

<!-- SKILLS MATRIX -->
<section class="sd-section" id="skills">
  <div class="sd-container">
    <div class="sd-section__head">
      <div class="sd-eyebrow"><span class="sec-num">05</span><span data-ar="الجدارات" data-en="Competencies"></span></div>
      <h2 data-ar="مصفوفة المهارات × البرامج" data-en="Skills × Programs matrix"></h2>
      <p data-ar="مستوى الإتقان لكل برنامج — I تعريف · D تطوير · M إتقان." data-en="Proficiency built per program — I Introduced · D Developed · M Mastered."></p>
    </div>
    <div class="sd-card sd-card--flat matrix-card"><div id="matrix"></div></div>
    <div class="legend">

<script>
'use strict';
const CATALOG = JSON.parse(document.getElementById('catalog-data').textContent);
const $ = (s, e = document) => e.querySelector(s); const $$ = (s, e = document) => [...e.querySelectorAll(s)];
const T = (ar, en) => SDAIA.t(ar, en);
const I = (name, cls) => SDAIA.icon(name, cls);
const esc = s => SDAIA.esc(s);
const isAr = () => SDAIA.lang === 'ar';

/* presentation palette mapped onto the shared brand tokens (data colours in the JSON are left untouched) */
const TRACK_COLOR = { L0: '#1C8A4E', FND: '#D9641F', AIE: '#1459A8', DSC: '#0E7C86' };
const TRACK_ICON = { L0: 'sunrise', FND: 'compass', AIE: 'cpu', DSC: 'chart-column' };
const LEVEL_COLOR = { L0: '#1C8A4E', L1: '#2A78D6', L2: '#1459A8', L3: '#0B2A4E' };
const TRACKMETA = Object.fromEntries(CATALOG.tracks.map(t => [t.id, { c: TRACK_COLOR[t.id] || t.color, ic: TRACK_ICON[t.id] || t.icon || 'layers' }]));
const LVLMETA = Object.fromEntries(CATALOG.levels.map(l => [l.id, { c: LEVEL_COLOR[l.id] || l.color }]));
const TYPEIC = { Program: 'book-open', Bootcamp: 'rocket', Workshop: 'wrench', Lab: 'flask-conical', Capstone: 'trophy' };
const TYPEAR = { Program: 'برنامج تدريبي', Bootcamp: 'معسكر مكثّف', Workshop: 'ورشة عمل', Lab: 'مختبر تطبيقي', Capstone: 'مشروع ختامي' };
const DELIVAR = { 'Instructor Led': 'تدريب بإشراف مدرّب' };
const typeName = t => T(TYPEAR[t] || t, t);
const delivName = d => T(DELIVAR[d] || d, d);
const L = (en, ar) => isAr() ? ar : en;   // pick a localised data field
const arPrograms = n => n === 1 ? 'برنامج واحد' : n === 2 ? 'برنامجان' : n <= 10 ? `${n} برامج` : `${n} برنامجًا`;
const hoursTag = h => T(`${h} ساعة`, `${h}h`);

/* ---------- ordered journey ---------- */
const ORDER = [['L0', 'L0'], ['FND', 'L1'], ['AIE', 'L1'], ['AIE', 'L2'], ['AIE', 'L3'], ['DSC', 'L1'], ['DSC', 'L2'], ['DSC', 'L3']];
const JOURNEY = []; ORDER.forEach(([t, l]) => CATALOG.programs.filter(p => p.track === t && p.level === l).forEach(p => JOURNEY.push(p)));
const TOTAL = JOURNEY.length;
let cur = 0; const done = new Set();
try { const s = localStorage.getItem('sdaia_done'); if (s) JSON.parse(s).forEach(c => done.add(c)); } catch (e) {}

function trackName(id) { const t = CATALOG.tracks.find(x => x.id === id); return L(t.name_en, t.name_ar); }
function lvlName(id) { const l = CATALOG.levels.find(x => x.id === id); return L(l.name_en, l.name_ar); }
const tags = s => (s || '').split(',').map(x => x.trim()).filter(Boolean).map(x => `<span class="sd-tag">${esc(x)}</span>`).join(' ');

/* ---------- hero stats ---------- */
function renderStats() {
  const nDays = CATALOG.programs.reduce((a, p) => a + (p.days || 0), 0);
  const nHours = CATALOG.programs.reduce((a, p) => a + (p.hours || 0), 0);
  const stats = [
    [CATALOG.programs.length, T('برنامجًا', 'Programs'), T('عبر أربعة مستويات', 'Across four levels'), 'layout-grid', 'tint-blue'],
    [CATALOG.tracks.length, T('مسارات', 'Pathways'), T('تمهيدي · أساس مشترك · مساران مهنيان', 'Beginner · core · two role tracks'), 'route', 'tint-orange'],
    [CATALOG.levels.length, T('مستويات', 'Levels'), T('تمهيدي · ممارس · متخصص · خبير', 'Beginner · Practitioner · Specialist · Expert'), 'layers', 'tint-teal'],
    [nDays, T('يومًا تدريبيًا', 'Training days'), T(`${SDAIA.n(nHours)} ساعة تدريب`, `${SDAIA.n(nHours)} training hours`), 'calendar-days', 'tint-green']
  ];
  $('#herostats').innerHTML = stats.map(([n, l, note, ic, tint]) => `<div class="sd-kpi"><span class="sd-iconbox ${tint}">${I(ic)}</span><div class="sd-kpi__num" data-count="${n}">0</div><div class="sd-kpi__label">${l}</div><div class="sd-kpi__note">${note}</div></div>`).join('');
  SDAIA.observeCounters($('#herostats'));
}

/* ---------- tracks ---------- */
function row(ic, le, la, ve, va) { return `<div class="r">${I(ic)}<div><b>${T(la, le)}: </b><span>${L(ve, va)}</span></div></div>`; }
function renderTracks() {
  $('#trackgrid').innerHTML = CATALOG.tracks.map(t => {
    const m = TRACKMETA[t.id]; const nP = CATALOG.programs.filter(p => p.track === t.id).length;
    return `<article class="sd-card sd-card--accent track-card" style="--tc:${m.c}">
      <div class="track-card__head"><span class="sd-iconbox">${I(m.ic)}</span>
        <div><h3>${L(t.name_en, t.name_ar)}</h3><span class="cnt">${T(arPrograms(nP), `${nP} programs`)}</span></div></div>
      <p>${L(t.desc_en, t.desc_ar)}</p>
      <div class="track-rows">
        ${row('target', 'Goal', 'الهدف', t.goal_en, t.goal_ar)}
        ${row('users', 'Audience', 'الفئة', t.audience_en, t.audience_ar)}
        ${row('briefcase', 'Roles', 'الوظائف', t.roles_en, t.roles_ar)}
        ${row('sparkles', 'Skills', 'المهارات', t.skills_en, t.skills_ar)}
        ${row('key-round', 'Prerequisites', 'المتطلبات', t.prereq_en, t.prereq_ar)}
      </div></article>`;
  }).join('');
}

/* ---------- levels ---------- */
function renderLevels() {
  $('#levelgrid').innerHTML = CATALOG.levels.map((l, i) => {
    const counts = CATALOG.tracks.map(t => [t.id, CATALOG.programs.filter(p => p.track === t.id && p.level === l.id).length]).filter(([, n]) => n > 0);
    return `<article class="sd-card level-card" style="--tc:${LVLMETA[l.id].c}">
      <div class="level-card__top"><span class="lv-n">${i + 1}</span><span class="sd-tag">${L(l.tech_en, l.tech_ar)}</span></div>
      <div class="sd-bar"><i style="--w:${(i + 1) / CATALOG.levels.length * 100}%"></i></div>
      <h3>${L(l.name_en, l.name_ar)}</h3>
      <p>${L(l.desc_en, l.desc_ar)}</p>
      <div class="counts">${counts.map(([id, n]) => `<span class="sd-tag tag-track" style="--tk:${TRACKMETA[id].c}"><span class="mono">${id}</span> · ${n}</span>`).join('')}</div>
      <div class="cred">${I('award')}<span>${L(l.credential_en, l.credential_ar)}</span></div>
    </article>`; }).join('');
}

/* ---------- journey stepper ---------- */
function renderRail() {
  $('#rail').innerHTML = JOURNEY.map((p, i) => {
    const active = i === cur, fin = done.has(p.code); const c = TRACKMETA[p.track].c;
    const conn = i < TOTAL - 1 ? `<span class="conn" aria-hidden="true"></span>` : '';
    return `<button type="button" data-i="${i}" class="railnode${active ? ' is-active' : ''}${fin ? ' is-done' : ''}" style="--tc:${c}" title="${esc(p.code)} — ${esc(L(p.name_en, p.name_ar))}" aria-label="${esc(L(p.name_en, p.name_ar))}"${active ? ' aria-current="step"' : ''}>${fin ? I('check') : i + 1}</button>${conn}`;
  }).join('');
  $('#totalcount').textContent = TOTAL;
  $$('.railnode').forEach(b => b.onclick = () => { cur = +b.dataset.i; renderStep(); $(`.railnode[data-i="${cur}"]`)?.focus(); });
}
function meta(ic, le, la, ve, va) { return `<div class="m"><div class="k">${I(ic)}${T(la, le)}</div><div class="v">${L(ve, va)}</div></div>`; }
function renderStep() {
  const p = JOURNEY[cur]; const m = TRACKMETA[p.track]; const fin = done.has(p.code);
  const list = (en, ar) => L(en, ar).map(x => `<li>${I('circle-check')}<span>${esc(x)}</span></li>`).join('');
  $('#stepcard').style.setProperty('--tc', m.c);
  $('#stepcard').innerHTML = `
    <div class="step-top">
      <div class="step-id">
        <span class="sd-iconbox">${I(TYPEIC[p.type] || 'book-open', 'i-lg')}</span>
        <div><div class="step-tags">
            <span class="step-code">${esc(p.code)}</span>
            <span class="sd-tag">${trackName(p.track)}</span>
            <span class="sd-tag">${lvlName(p.level)}</span>
            <span class="sd-tag">${typeName(p.type)}</span></div>
          <h3>${L(p.name_en, p.name_ar)}</h3></div>
      </div>
      <button id="doneBtn" type="button" class="sd-btn sd-btn--sm ${fin ? 'sd-btn--primary' : 'sd-btn--secondary'}" aria-pressed="${fin}">${I(fin ? 'circle-check-big' : 'circle')}<span>${fin ? T('مكتمل', 'Completed') : T('إتمام', 'Mark complete')}</span></button>
    </div>
    <p class="desc">${L(p.desc_en, p.desc_ar)}</p>
    <div class="step-meta">
      ${meta('signal', 'Delivery', 'النمط', p.delivery, DELIVAR[p.delivery] || p.delivery)}
      ${meta('clock', 'Duration', 'المدة', `${p.duration_en} · ${p.hours}h`, `${p.duration_ar} · ${p.hours} ساعة`)}
      ${meta('users', 'Audience', 'الفئة', p.audience_en, p.audience_ar)}
      ${meta('award', 'Credential', 'الشهادة', p.credential_en, p.credential_ar)}
    </div>
    <div class="step-cols">
      <div><h4>${I('target')}${T('نواتج التعلّم', 'Learning Outcomes')}</h4><ul class="check-list">${list(p.outcomes_en, p.outcomes_ar)}</ul></div>
      <div><h4>${I('list-tree')}${T('الموضوعات', 'Topics Covered')}</h4><ul class="check-list">${list(p.topics_en, p.topics_ar)}</ul></div>
    </div>
    <div class="step-more">
      <div>
        <div class="blk"><h4>${T('المتطلبات السابقة', 'Prerequisites')}</h4><p>${L(p.prereq_en, p.prereq_ar)}</p></div>
        <div class="blk"><h4>${T('المهارات والأدوات', 'Skills & Tools')}</h4><p style="margin-bottom:.5rem">${L(p.tech_en, p.tech_ar || p.tech_en)}</p><div class="sd-chips" style="gap:.35rem">${tags(p.tools)}</div></div>
        <div class="blk"><h4>${T('التقييم', 'Assessment')}</h4><p>${L(p.assessment_en, p.assessment_ar)}</p></div>
      </div>
      <div>
        <div class="blk"><h4>${T('التراكمية', 'Stackability')}</h4><p>${L(p.stack_en, p.stack_ar)}</p>
          <div class="stack-row">
            <span class="sd-tag">${T('السابق', 'Prev')}: <span class="mono">${esc(p.prev)}</span></span>${I('arrow-right', 'i-flip')}
            <span class="sd-tag sd-tag--brand mono">${esc(p.code)}</span>${I('arrow-right', 'i-flip')}
            <span class="sd-tag">${T('التالي', 'Next')}: <span class="mono">${esc(p.next)}</span></span></div></div>
        <div class="blk"><h4>${T('الصلة بالقطاع', 'Industry Relevance')}</h4><div class="sd-chips" style="gap:.35rem">${tags(L(p.industry_en, p.industry_ar))}</div></div>
      </div>
    </div>`;
  $('#stepnum').textContent = cur + 1; $('#steptotal').textContent = TOTAL;
  $('#doneBtn').onclick = () => { done.has(p.code) ? done.delete(p.code) : done.add(p.code); persist(); renderRail(); renderStep(); $('#doneBtn')?.focus(); };
  $('#prevBtn').disabled = cur === 0; $('#nextBtn').disabled = cur === TOTAL - 1;
  renderRail(); updateProgress();
  scrollRailTo($(`.railnode[data-i="${cur}"]`));
}
/* keep the active node centred in the horizontal rail without moving the page (RTL-aware) */
function scrollRailTo(node) {
  const wrap = $('.rail-wrap'); if (!node || !wrap) return;
  const n = node.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  const delta = (n.left + n.width / 2) - (w.left + w.width / 2);
  try { wrap.scrollBy({ left: delta, behavior: railReady ? 'smooth' : 'auto' }); } catch (e) { wrap.scrollLeft += delta; }
}
let railReady = false; requestAnimationFrame(() => { railReady = true; });
function persist() { try { localStorage.setItem('sdaia_done', JSON.stringify([...done])); } catch (e) {} }
function updateProgress() {
  const pc = Math.round(done.size / TOTAL * 100);
  $('#pct').textContent = pc + '%'; $('#donecount').textContent = done.size;
  $('#ring').style.strokeDashoffset = 226 - (226 * pc / 100);
}

/* ---------- catalog grid ---------- */
let fTrack = 'all', fLevel = 'all', fQ = '';
function renderFilters() {
  const tf = [['all', T('كل المسارات', 'All tracks')]].concat(CATALOG.tracks.map(t => [t.id, L(t.name_en, t.name_ar)]));
  $('#trackFilter').innerHTML = tf.map(([v, l]) => `<button type="button" data-t="${v}" aria-pressed="${v === fTrack}">${l}</button>`).join('');
  const lf = [['all', T('كل المستويات', 'All levels')]].concat(CATALOG.levels.map(l => [l.id, L(l.name_en.split(' (')[0], l.name_ar.split(' (')[0])]));
  $('#levelFilter').innerHTML = lf.map(([v, l]) => `<button type="button" data-l="${v}" aria-pressed="${v === fLevel}">${l}</button>`).join('');
  $$('#trackFilter button').forEach(b => b.onclick = () => { fTrack = b.dataset.t; renderFilters(); renderCatalog(); $(`#trackFilter button[data-t="${fTrack}"]`)?.focus(); });
  $$('#levelFilter button').forEach(b => b.onclick = () => { fLevel = b.dataset.l; renderFilters(); renderCatalog(); $(`#levelFilter button[data-l="${fLevel}"]`)?.focus(); });
}
function renderCatalog() {
  const q = fQ.toLowerCase();
  const items = CATALOG.programs.filter(p => (fTrack === 'all' || p.track === fTrack) && (fLevel === 'all' || p.level === fLevel) &&
    (!q || [p.code, p.name_en, p.name_ar, p.tech_en, p.tech_ar, p.tools, p.industry_en, p.industry_ar, p.type].join(' ').toLowerCase().includes(q)));
  $('#emptymsg').hidden = items.length > 0;
  $('#catcount').innerHTML = T(`<b>${items.length}</b> من <b>${CATALOG.programs.length}</b> برنامجًا`, `<b>${items.length}</b> of <b>${CATALOG.programs.length}</b> programs`);
  $('#catgrid').innerHTML = items.map(p => { const m = TRACKMETA[p.track];
    return `<article class="sd-card prog-card" style="--tc:${m.c}">
      <div class="prog-card__top"><span class="sd-iconbox">${I(TYPEIC[p.type] || 'book-open')}</span><span class="code">${esc(p.code)}</span></div>
      <h3>${L(p.name_en, p.name_ar)}</h3>
      <div class="tags"><span class="sd-tag">${lvlName(p.level)}</span><span class="sd-tag">${typeName(p.type)}</span><span class="sd-tag">${L(p.duration_en, p.duration_ar)}</span><span class="sd-tag num">${hoursTag(p.hours)}</span></div>
      <p class="desc">${L(p.desc_en, p.desc_ar)}</p>
      <button type="button" class="cardtog" aria-expanded="false" data-code="${p.code}"><span>${T('التفاصيل', 'Details')}</span>${I('chevron-down')}</button>
      <div class="expandable"><div><div class="exp-body">
        <div><div class="lbl">${T('النواتج', 'Outcomes')}</div><ul>${L(p.outcomes_en, p.outcomes_ar).slice(0, 5).map(x => `<li><span>${esc(x)}</span></li>`).join('')}</ul></div>
        <div><div class="lbl">${T('الموضوعات', 'Topics')}</div><div class="sd-chips" style="gap:.3rem">${L(p.topics_en, p.topics_ar).map(x => `<span class="sd-tag">${esc(x)}</span>`).join('')}</div></div>
        <div class="two">
          <div><div class="lbl">${T('الأدوات', 'Tools')}</div><p>${esc(p.tools)}</p></div>
          <div><div class="lbl">${T('التقييم', 'Assessment')}</div><p>${L(p.assessment_en, p.assessment_ar)}</p></div></div>
        <div><div class="lbl">${T('التراكمية', 'Stackability')}</div><p>${L(p.stack_en, p.stack_ar)}</p></div>
        <div class="stack-row"><span class="sd-tag mono">${esc(p.prev)}</span>${I('arrow-right', 'i-flip')}<span class="sd-tag sd-tag--brand mono">${esc(p.code)}</span>${I('arrow-right', 'i-flip')}<span class="sd-tag mono">${esc(p.next)}</span></div>
        <a href="#journey" class="open-step" data-code="${p.code}">${T('افتح في الرحلة', 'Open in journey')}${I('arrow-up-right', 'i-flip')}</a>
      </div></div></div></article>`; }).join('');
  $$('.cardtog').forEach(b => b.onclick = () => { const ex = b.nextElementSibling; const open = ex.classList.toggle('open'); b.setAttribute('aria-expanded', String(open)); });
  $$('.open-step').forEach(a => a.onclick = () => { const i = JOURNEY.findIndex(p => p.code === a.dataset.code); if (i >= 0) { cur = i; renderStep(); } });
}

/* ---------- skills matrix ---------- */
function renderMatrix() {
  const codes = CATALOG.programs.map(p => p.code);
  let h = '<table class="mx"><thead><tr><th class="fam">' + T('عائلة المهارة', 'Skill family') + '</th>';
  codes.forEach(c => h += `<th scope="col"><span>${esc(c)}</span></th>`);
  h += '</tr></thead><tbody>';
  CATALOG.skill_families.forEach(f => {
    h += `<tr><th scope="row" class="fam">${L(f.en, f.ar)}</th>`;
    codes.forEach(c => { const p = CATALOG.programs.find(x => x.code === c); const v = (p.skills || {})[f.key];
      h += `<td><div class="cell ${v || ''}" title="${esc(c)} · ${esc(L(f.en, f.ar))}">${v || ''}</div></td>`; });
    h += '</tr>';
  });
  h += '</tbody></table>';
  $('#matrix').innerHTML = h;
}

/* ---------- naming + recs ---------- */

  const N = [['SDA', T('بادئة أكاديمية سدايا على كل برنامج مهني', 'SDAIA Academy prefix on every professional program')],
    ['TRACK', T('FND الأساس المشترك · AIE مهندس الذكاء الاصطناعي · DSC عالِم البيانات — وتُضاف مسارات جديدة بالنمط نفسه', 'FND Foundation Core · AIE AI Engineer · DSC Data Scientist — new tracks plug in (APM, ASA, MLE, GAI)')],
    ['LEVEL', T('1 ممارس · 2 متخصص · 3 خبير', '1 Practitioner · 2 Specialist · 3 Expert')],
    ['SEQ', T('ترتيب من رقمين داخل المسار والمستوى · ويُحجز 90 للمشروع الختامي للمسار', 'Two-digit order within the track and level · 90 is reserved for the track capstone')],
    ['L0', T('برامج المستوى التمهيدي ترمز بثلاثة أحرف (FAE, FGP, FAA, FDL, FDS, FDV) — مفتوحة وغير تقنية وبلا بادئة مسار', 'Beginner programs use a short three-letter code (FAE, FGP, FAA, FDL, FDS, FDV) — open, non-technical, no track prefix')],
    ['TITLE', T('[المجال]+[التقنية]+[النطاق] · ≤7 كلمات · دون "مقدمة في"', '[Domain]+[Tech]+[Scope] · ≤7 words · no "Introduction to"')]];
  $('#naming').innerHTML = N.map(([k, v]) => `<div class="r"><span class="k">${k}</span><span>${v}</span></div>`).join('');
}
function renderRecs() {
  const R = [['layers', 'Future tracks', 'مسارات مستقبلية', 'Add AI Product Manager, Solution Architect, ML Engineer & GenAI Specialist on the same scheme.', 'إضافة مسارات مدير المنتج ومعماري الحلول ومهندس تعلم الآلة وأخصائي الذكاء التوليدي بنفس النظام.'],
    ['shuffle', 'Cross-track electives', 'مواد اختيارية متقاطعة', 'Let experts take one elective from the sister track to build T-shaped profiles.', 'السماح للخبراء بمادة اختيارية من المسار الشقيق لبناء ملفات على شكل T.'],
    ['badge-check', 'Skills-based RPL', 'اعتراف بالتعلم السابق', 'Use the skills matrix for recognition of prior learning and placement tests.', 'استخدام مصفوفة المهارات للاعتراف بالتعلم السابق واختبارات تحديد المستوى.'],
    ['languages', 'Arabic-first content', 'محتوى عربي أولًا', 'Prioritise Arabic NLP datasets, tooling and case studies across GenAI/NLP modules.', 'إعطاء الأولوية لبيانات وأدوات وحالات اللغة العربية في وحدات الذكاء التوليدي ومعالجة اللغة.'],
    ['shield-check', 'Responsible-AI spine', 'عمود الذكاء المسؤول', 'Thread responsible-AI checkpoints through every level, not only the expert module.', 'تمرير نقاط تحقق الذكاء المسؤول عبر كل مستوى وليس وحدة الخبير فقط.'],
    ['git-branch', 'Governed versioning', 'إصدارات محوكمة', 'Adopt vYYYY.R releases with a change log and an academic review board.', 'اعتماد إصدارات بترقيم محوكم مع سجل تغييرات ومجلس مراجعة أكاديمي.']];
  $('#recs').innerHTML = R.map(([ic, te, ta, de, da]) => `<div class="sd-card sd-card--flat rec"><span class="sd-iconbox sd-iconbox--sm tint-blue">${I(ic, 'i-sm')}</span><div><b>${T(ta, te)}</b><p>${T(da, de)}</p></div></div>`).join('');
}

/* ---------- in-page nav ---------- */
function renderNav() {
  const Lk = [['tracks', 'Pathways', 'المسارات', 'route'], ['levels', 'Levels', 'المستويات', 'layers'], ['journey', 'Journey', 'الرحلة', 'milestone'], ['catalog', 'Catalog', 'الكاتالوج', 'layout-grid'], ['skills', 'Skills', 'المهارات', 'sparkles'], ['design', 'Design', 'التصميم', 'pencil-ruler']];
  $('#navlinks').innerHTML = Lk.map(([id, e, a, ic]) => `<a href="#${id}">${I(ic)}<span>${T(a, e)}</span></a>`).join('');
}

function renderAll() {
  renderStats(); renderTracks(); renderLevels(); renderStep(); renderFilters(); renderCatalog(); renderMatrix(); renderNaming(); renderRecs(); renderNav();
}

const toJourney = () => { const y = $('#journey').getBoundingClientRect().top + window.scrollY - 64; window.scrollTo({ top: y, behavior: 'smooth' }); };
$('#prevBtn').onclick = () => { if (cur > 0) { cur--; renderStep(); toJourney(); } };
$('#nextBtn').onclick = () => { if (cur < TOTAL - 1) { cur++; renderStep(); toJourney(); } };
$('#search').addEventListener('input', e => { fQ = e.target.value; renderCatalog(); });
renderAll();
SDAIA.onLang(renderAll);
</script>
