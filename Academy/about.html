<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عن أكاديمية سدايا | About SDAIA Academy</title>
<meta name="description" content="أكاديمية سدايا — الأكاديمية الوطنية لبناء القدرات في مجالي البيانات والذكاء الاصطناعي: النبذة، الرؤية، الرسالة، الأهداف، مجالات العمل والأثر المستهدف. About SDAIA Academy: overview, vision, mission, objectives, focus areas and target impact.">
<link rel="icon" type="image/png" href="assets/academy-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10233B; --ink-2:#41566E; --ink-3:#7A8CA0;
  --brand:#1F6FB2; --brand-d:#164F80; --brand-l:#E9F2FA;
  --teal:#0E7C86; --teal-d:#0A4E57; --teal-l:#E7F4F5; --teal-m:#2E96A3;
  --accent:#C75B1E; --accent-l:#FBEFE7;
  --green:#1C7C43; --green-l:#E8F4EC;
  --bg:#F6F9FC; --card:#FFFFFF; --line:#E2EAF2; --line-2:#D3DCE4;
  --r:14px; --shadow:0 1px 2px rgba(15,42,74,.05),0 8px 24px rgba(15,42,74,.07);
  /* ---- icon design tokens (identical to index.html) ---- */
  --i-sm:16px; --i-md:20px; --i-lg:22px; --i-stroke:1.75;
  --chip:42px; --chip-r:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Inter',sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:'Inter','IBM Plex Sans Arabic',sans-serif}
.container{max-width:1180px;margin:0 auto;padding:0 22px}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== Icon system — Lucide 1.28, inline sprite, one icon set site-wide ===== */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.i{width:var(--i-md);height:var(--i-md);flex:none;display:inline-block;
   fill:none;stroke:currentColor;stroke-width:var(--i-stroke);stroke-linecap:round;stroke-linejoin:round;
   vertical-align:-.19em;overflow:visible}
.i-sm{width:var(--i-sm);height:var(--i-sm);stroke-width:2}
.i-lg{width:var(--i-lg);height:var(--i-lg)}
html[dir="rtl"] .i-flip{transform:scaleX(-1)}
.chip{width:var(--chip);height:var(--chip);border-radius:var(--chip-r);display:inline-flex;
      align-items:center;justify-content:center;background:var(--teal-l);color:var(--teal-d);flex:none}
.tint-teal{background:var(--teal-l);color:var(--teal-d)}
.tint-blue{background:var(--brand-l);color:var(--brand-d)}
.tint-cyan{background:#E4F3F5;color:#1B7480}
.tint-orange{background:var(--accent-l);color:var(--accent)}
.tint-green{background:var(--green-l);color:var(--green)}
.tint-navy{background:#E8EEF6;color:#1B3E63}

/* ===== Header ===== */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:14px;padding:12px 0}
.hd img{height:44px;width:auto}
.hd .brand-name{font-weight:700;font-size:17px;line-height:1.3}
.hd .brand-sub{font-size:12px;color:var(--ink-3)}
nav.top{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap;align-items:center}
nav.top a{padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
nav.top a:hover{background:var(--teal-l);color:var(--teal-d);text-decoration:none}
nav.top a.on{background:var(--teal-l);color:var(--teal-d)}
.lang-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--card);border-radius:9px;padding:7px 13px;font-family:inherit;font-size:13px;font-weight:600;color:var(--brand-d);cursor:pointer;transition:background .12s ease,border-color .12s ease}
.lang-btn:hover{background:var(--brand-l);border-color:#CFE3F3}

/* ===== Hero ===== */
.hero{background:linear-gradient(135deg,var(--teal-d) 0%,#0F3F63 55%,var(--brand-d) 100%);color:#fff;padding:64px 0 56px}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 16px;font-size:13px;font-weight:600;letter-spacing:.3px;margin-bottom:18px}
.hero h1{font-size:clamp(28px,4.5vw,44px);font-weight:700;line-height:1.25;max-width:19em}
.hero p.lead{margin-top:14px;font-size:16.5px;max-width:44em;color:rgba(255,255,255,.88)}

/* ===== Sections ===== */
section{padding:52px 0 8px}
.sec-head{margin-bottom:24px}
.sec-head h2{font-size:24px;font-weight:700}
.sec-head p{color:var(--ink-2);font-size:14.5px;margin-top:6px;max-width:52em}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--teal);text-transform:uppercase;margin-bottom:3px}
.prose p{color:var(--ink-2);font-size:15px;margin-bottom:14px;max-width:62em}
.prose p strong{color:var(--ink);font-weight:600}

/* ===== Vision / mission split ===== */
.vm{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.vm{grid-template-columns:1fr}}
.vm .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.vm .box::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--teal)}
.vm .box.b2::before{background:var(--brand)}
.vm .box .chip{width:44px;height:44px;border-radius:12px;margin-bottom:14px}
.vm .box h3{font-size:17px;font-weight:700;margin-bottom:8px}
.vm .box p{color:var(--ink-2);font-size:14.5px}

/* ===== Numbered objective list ===== */
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.obj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start;transition:transform .12s ease,border-color .12s ease}
.obj:hover{transform:translateY(-2px);border-color:var(--teal-m)}
.obj .n{flex:none;width:34px;height:34px;border-radius:10px;background:var(--teal-l);color:var(--teal-d);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.obj p{font-size:14px;color:var(--ink-2)}

/* ===== Pill list ===== */
.pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink-2);transition:transform .12s ease,border-color .12s ease}
.pill:hover{transform:translateY(-2px);border-color:var(--teal-m)}
.pill .chip{width:34px;height:34px;border-radius:10px}

/* ===== Impact ===== */
.impact{background:var(--ink);border-radius:var(--r);padding:30px 28px;color:#DCE6F0}
.impact h3{color:#fff;font-size:19px;font-weight:700;margin-bottom:6px}
.impact .sub{font-size:13.5px;color:#9FB3C8;margin-bottom:20px}
.impact .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.impact .it{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:15px 17px;font-size:14px;line-height:1.6}
.impact .it .ih{display:flex;align-items:center;gap:9px;margin-bottom:6px;color:#7FD1DB}
.impact .it b{color:#7FD1DB;font-size:12px;font-weight:700;letter-spacing:.5px}

/* ===== Alignment strip ===== */
.align{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.align .a{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.align .a .ah{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.align .a .eb{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--accent);text-transform:uppercase}
.align .a .chip{width:32px;height:32px;border-radius:9px}
.align .a h3{font-size:15.5px;font-weight:700;margin-top:6px}
.align .a p{font-size:13.5px;color:var(--ink-2);margin-top:5px}

/* ===== CTA ===== */
.cta-band{margin-top:44px;background:linear-gradient(135deg,var(--teal-d),var(--brand-d));border-radius:var(--r);padding:30px 28px;color:#fff;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.cta-band h3{font-size:19px;font-weight:700}
.cta-band p{font-size:14px;color:rgba(255,255,255,.85);margin-top:4px;max-width:40em}
.cta-band .b{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:11px;padding:12px 20px;font-weight:600;font-size:14.5px;transition:transform .12s ease,background .12s ease}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn.primary{background:#fff;color:var(--teal-d)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}

/* ===== Footer ===== */
footer{margin-top:56px;border-top:1px solid var(--line);background:var(--card);padding:26px 0 34px;color:var(--ink-3);font-size:13px}
footer .frow{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer .top-link{display:inline-flex;align-items:center;gap:7px;font-weight:600}

@media(max-width:640px){
  .hd .brand-sub{display:none}
  nav.top a{display:none}          /* hide nav links, keep the language toggle reachable */
  nav.top{gap:0}
}
</style>
</head>

<!-- ===== Overview ===== -->

         data-ar="<strong>أكاديمية سدايا</strong> هي الأكاديمية الوطنية لبناء القدرات في مجالي البيانات والذكاء الاصطناعي، وإحدى مبادرات الهيئة السعودية للبيانات والذكاء الاصطناعي (سدايا). تُعنى الأكاديمية بتصميم وتنفيذ المبادرات والبرامج التدريبية من خلال منظومة متكاملة من الشراكات المحلية والإقليمية والعالمية، بما يسهم في إعداد كفاءات وطنية مؤهلة لقيادة سوق العمل ومواكبة متطلبات مهن المستقبل."
         data-en="<strong>SDAIA Academy</strong> is the national academy for building capability in data and artificial intelligence, and one of the initiatives of the Saudi Data &amp; AI Authority (SDAIA). The Academy designs and delivers training initiatives and programs through an integrated ecosystem of local, regional and global partnerships, contributing to the preparation of qualified national talent able to lead the labour market and keep pace with the requirements of the professions of the future."></p>
      <p class="t"
         data-ar="وتهدف الأكاديمية إلى تمكين الكفاءات الوطنية بالمهارات المهنية والتقنية في مجالي البيانات والذكاء الاصطناعي، بما ينسجم مع مستهدفات <strong>برنامج تنمية القدرات البشرية</strong>، أحد برامج <strong>رؤية المملكة العربية السعودية 2030</strong>."

<script>
'use strict';
(function(){
  var lang = 'ar';
  try{ lang = localStorage.getItem('sdaia_lang') || 'ar'; }catch(e){}
  var btn = document.getElementById('langToggle');
  var label = document.getElementById('langLabel');
  function apply(){
    var isAr = lang === 'ar';
    document.documentElement.setAttribute('lang', isAr ? 'ar' : 'en');
    document.documentElement.setAttribute('dir', isAr ? 'rtl' : 'ltr');
    var nodes = document.querySelectorAll('.t');
    for (var i = 0; i < nodes.length; i++){
      var el = nodes[i];
      var txt = isAr ? el.getAttribute('data-ar') : el.getAttribute('data-en');
      if (txt !== null) el.innerHTML = txt;
    }
    label.textContent = isAr ? 'English' : 'العربية';
    document.title = isAr ? 'عن أكاديمية سدايا | About SDAIA Academy' : 'About SDAIA Academy | عن أكاديمية سدايا';
  }
  btn.addEventListener('click', function(){
    lang = (lang === 'ar') ? 'en' : 'ar';
    try{ localStorage.setItem('sdaia_lang', lang); }catch(e){}
    apply();
  });
  apply();
})();
</script>
