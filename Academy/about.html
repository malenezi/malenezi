<!-- ===== Overview ===== -->
<section class="sd-section" id="overview">
  <div class="sd-container">
    <div class="sd-section__head">
      <div class="sd-eyebrow"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-landmark"/></svg><span data-ar="نبذة عامة" data-en="Overview"></span></div>
      <h2 data-ar="من نحن" data-en="Who we are"></h2>
    </div>
    <div class="intro">
      <div class="prose">
        <p data-ar="<strong>أكاديمية سدايا</strong> هي الأكاديمية الوطنية لبناء القدرات في مجالي البيانات والذكاء الاصطناعي، وإحدى مبادرات الهيئة السعودية للبيانات والذكاء الاصطناعي (سدايا). تُعنى الأكاديمية بتصميم وتنفيذ المبادرات والبرامج التدريبية من خلال منظومة متكاملة من الشراكات المحلية والإقليمية والعالمية، بما يسهم في إعداد كفاءات وطنية مؤهلة لقيادة سوق العمل ومواكبة متطلبات مهن المستقبل." data-en="<strong>SDAIA Academy</strong> is the national academy for building capability in data and artificial intelligence, and one of the initiatives of the Saudi Data &amp; AI Authority (SDAIA). The Academy designs and delivers training initiatives and programs through an integrated ecosystem of local, regional and global partnerships, contributing to the preparation of qualified national talent able to lead the labour market and keep pace with the requirements of the professions of the future."></p>
        <p data-ar="وتهدف الأكاديمية إلى تمكين الكفاءات الوطنية بالمهارات المهنية والتقنية في مجالي البيانات والذكاء الاصطناعي، بما ينسجم مع مستهدفات <strong>برنامج تنمية القدرات البشرية</strong>، أحد برامج <strong>رؤية المملكة العربية السعودية 2030</strong>." data-en="The Academy aims to empower national talent with the professional and technical skills of data and artificial intelligence, in alignment with the targets of the <strong>Human Capability Development Program</strong>, one of the programs of <strong>Saudi Vision 2030</strong>."></p>
        <p data-ar="وتقدم الأكاديمية برامج تدريبية، ومعسكرات مكثفة، وشهادات مهنية متخصصة بالتعاون مع نخبة من الجامعات والمؤسسات الأكاديمية والشركات العالمية، بما يعزز جودة مخرجات التدريب، ويسهم في بناء مجتمع رقمي واعٍ ومُمكَّن يدعم التحول نحو اقتصاد معرفي مستدام." data-en="The Academy delivers training programs, intensive bootcamps and specialised professional certificates in cooperation with a select group of universities, academic institutions and global companies — raising the quality of training outcomes and helping build an aware, empowered digital society that supports the transition to a sustainable knowledge economy."></p>
      </div>
      <div class="facts" role="list">
        <div class="fact" role="listitem"><span class="sd-iconbox sd-iconbox--sm tint-navy"><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-landmark"/></svg></span><div><b data-ar="الجهة الأم" data-en="Parent authority"></b><span data-ar="الهيئة السعودية للبيانات والذكاء الاصطناعي (سدايا)" data-en="Saudi Data &amp; AI Authority (SDAIA)"></span></div></div>
        <div class="fact" role="listitem"><span class="sd-iconbox sd-iconbox--sm tint-orange"><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-flag"/></svg></span><div><b data-ar="الإطار الوطني" data-en="National framework"></b><span data-ar="رؤية 2030 · برنامج تنمية القدرات البشرية · الاستراتيجية الوطنية للبيانات والذكاء الاصطناعي" data-en="Vision 2030 · Human Capability Development Program · National Strategy for Data &amp; AI"></span></div></div>
        <div class="fact" role="listitem"><span class="sd-iconbox sd-iconbox--sm tint-blue"><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-book-open"/></svg></span><div><b data-ar="ما تقدّمه" data-en="What it delivers"></b><span data-ar="برامج تدريبية، ومعسكرات مكثفة، وشهادات مهنية متخصصة" data-en="Training programs, intensive bootcamps and specialised professional certificates"></span></div></div>
        <div class="fact" role="listitem"><span class="sd-iconbox sd-iconbox--sm tint-green"><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-handshake"/></svg></span><div><b data-ar="الشراكات" data-en="Partnerships"></b><span data-ar="منظومة متكاملة من الشراكات المحلية والإقليمية والعالمية" data-en="An integrated ecosystem of local, regional and global partnerships"></span></div></div>
      </div>

</section>
