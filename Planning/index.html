<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تخطيط القدرات وتقييم الاحتياج | Data &amp; AI Capacity Planning</title>
<meta name="theme-color" content="#0d6b5d">
<meta name="description" content="The executive reference for planning Saudi Arabia's Data & AI capacity: progress against national targets, the national evidence system, global benchmarking, the competency matrix and emerging skills, needs assessment with public vs private contrast, and the 2026–2030 roadmap.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d6b5d'/%3E%3Crect x='7' y='10' width='12' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='18' width='18' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#f2f5f4; --surface:#ffffff; --surface-2:#e9efed; --surface-3:#dfe7e5;
  --ink:#13282c; --ink-2:#465a5d; --ink-3:#5a6b6e; --line:#d5dedc; --line-2:#bccac7;
  --accent:#0d6b5d; --accent-ink:#0a5a4e; --accent-wash:#dbede8;
  --gap:#985808; --gap-fill:#d98b26; --gap-wash:#fbecd6;
  --muted-mark:#b9c4c2;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arab:"IBM Plex Sans Arabic","Segoe UI","Tahoma",sans-serif;
  --rail:252px; --max:1120px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0f1d20; --surface:#152629; --surface-2:#1c3135; --surface-3:#243b40;
    --ink:#e6eeed; --ink-2:#b0c0bf; --ink-3:#9aabaa; --line:#29403f; --line-2:#36504f;
    --accent:#4fb8a4; --accent-ink:#6fcab8; --accent-wash:#183a36;
    --gap:#e5a54f; --gap-fill:#c98500; --gap-wash:#3a2d18; --muted-mark:#4a6262;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0f1d20; --surface:#152629; --surface-2:#1c3135; --surface-3:#243b40;
  --ink:#e6eeed; --ink-2:#b0c0bf; --ink-3:#9aabaa; --line:#29403f; --line-2:#36504f;
  --accent:#4fb8a4; --accent-ink:#6fcab8; --accent-wash:#183a36;
  --gap:#e5a54f; --gap-fill:#c98500; --gap-wash:#3a2d18; --muted-mark:#4a6262;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-family:var(--arab);font-size:16.5px;line-height:1.8}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.skip{position:absolute;inset-inline-start:-999px;top:8px;background:var(--surface);padding:8px 12px;z-index:50}
.skip:focus{inset-inline-start:8px}
h1,h2,h3,h4{font-family:var(--cond);font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:0}
html[lang="ar"] :is(h1,h2,h3,h4,.num,.v,.cond){font-family:var(--arab);letter-spacing:0}
p{margin:0 0 12px}
.num{font-family:var(--cond);font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.src{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:10px}
.src a{color:var(--ink-3)}

/* shell */
.rail{position:fixed;inset-block:0;inset-inline-start:0;width:var(--rail);background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:22px 18px;z-index:20;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:flex-start;margin-bottom:26px}
.brand-mark{width:30px;height:30px;flex:none;border-radius:7px;background:var(--accent);position:relative;overflow:hidden}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;inset-inline:6px;height:3px;background:var(--surface);border-radius:2px}
.brand-mark::before{top:9px;inset-inline-end:12px}.brand-mark::after{top:17px}
.brand b{display:block;font:600 14.5px/1.3 var(--cond)}
html[lang="ar"] .brand b{font-family:var(--arab)}
.brand span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.4}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:8px;padding:7px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:14.5px;border-inline-start:2px solid transparent}
.nav a .n{color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:1.1em}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="true"]{color:var(--ink);background:var(--accent-wash);border-inline-start-color:var(--accent);font-weight:500}
.rail-foot{margin-top:auto;padding-top:20px;font-size:12.5px;color:var(--ink-3);line-height:1.55}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;font:500 13px var(--sans);cursor:pointer}
html[lang="ar"] .pill{font-family:var(--arab)}
.pill:hover{color:var(--ink);border-color:var(--ink-3)}
.pill[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);color:var(--ink)}
.topbar{display:none}
main{margin-inline-start:var(--rail)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 40px}
section.band{padding:72px 0 64px;border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:40px;align-items:end;margin-bottom:36px}
.sec-head h2{font-size:clamp(28px,3.2vw,38px)}
.sec-head .lede{color:var(--ink-2);font-size:17px;max-width:64ch;margin:0}
.kicker{font-size:14px;color:var(--accent-ink);font-weight:500;margin-bottom:8px;display:block}
.question{display:inline-block;font-size:13.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:14px;background:var(--surface)}
h3{font-size:21px;margin-bottom:6px}
.block{margin-top:44px}
.sub-h{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.sub-h p{margin:0;color:var(--ink-2);max-width:72ch}

/* hero */
.hero{padding:56px 0 52px;background:var(--surface);border-bottom:1px solid var(--line)}
.edition{font-size:13.5px;color:var(--ink-3);margin-bottom:22px;display:flex;gap:14px;flex-wrap:wrap}
.hero h1{font-size:clamp(38px,5vw,62px);font-weight:700;letter-spacing:-.02em;max-width:17ch;line-height:1.08}
html[lang="ar"] .hero h1{line-height:1.3;max-width:20ch}
.hero .lede{font-size:18.5px;color:var(--ink-2);max-width:64ch;margin:20px 0 0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;margin-top:40px}
.tile{padding:20px 22px;border-inline-end:1px solid var(--line)}
.tile:last-child{border-inline-end:0}
.tile .k{font-size:14px;color:var(--ink-2);font-weight:500}
.tile .v{font:600 38px/1.15 var(--cond);margin:6px 0;font-variant-numeric:tabular-nums}
.tile .s{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.tile[data-tone="gap"] .v{color:var(--gap)}
.tile[data-tone="good"] .v{color:var(--accent-ink)}
.story{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.story li{padding:16px 16px 0 0;border-inline-end:1px solid var(--line);padding-inline:16px}
.story li:first-child{padding-inline-start:0}
.story li:last-child{border-inline-end:0}
.story b{display:block;font-size:13px;color:var(--accent-ink);font-weight:600;margin-bottom:4px}
.story span{font-size:14.5px;color:var(--ink-2);line-height:1.55}

/* cards / grids */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid2>*,.grid3>*,.wrap>*{min-width:0}
.tbl-wrap{max-width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.card h4{font-size:17px;margin-bottom:6px}
.card p{color:var(--ink-2);font-size:15px;margin:0}
.vm .card h4{color:var(--accent-ink);font-size:14px;font-weight:600}
.vm .card p{font-size:17.5px;color:var(--ink);line-height:1.6}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:start;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td .cite{font-size:12.5px}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.set{background:var(--accent-wash);border-color:transparent;color:var(--accent-ink)}
.chip.wait{background:var(--gap-wash);border-color:transparent;color:var(--gap)}
.chip.layer{background:var(--surface-2);border-color:transparent}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* pyramid */
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pyr .tier{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-radius:8px;background:var(--surface);border:1px solid var(--line);width:var(--w)}
.pyr .tier.hot{background:var(--accent-wash);border-color:var(--accent)}
.pyr .tier b{font-size:15.5px}
.pyr .tier span{font-size:13px;color:var(--ink-2)}
.pyr .tier .t{font:600 18px var(--cond);text-align:end;font-variant-numeric:tabular-nums}
html[lang="ar"] .pyr .tier .t{font-family:var(--arab)}
.pyr-note{font-size:13.5px;color:var(--ink-3);text-align:center;margin-top:10px}

/* index cards */
.idx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.idx .card{display:flex;flex-direction:column;gap:8px}
.idx .pub{font-size:12.5px;color:var(--ink-3)}
.idx .pos{font:600 20px/1.3 var(--cond)}
html[lang="ar"] .idx .pos{font-family:var(--arab);font-size:18px}
.idx .sig{font-size:14px;color:var(--ink-2)}
.idx .ed{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px}
.idx .flag{color:var(--gap)}

/* chart */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 16px 10px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--ink-2);font-family:inherit}

/* scale */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lvl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;position:relative}
.lvl .no{font:700 28px/1 var(--cond);color:var(--accent-ink)}
.lvl b{display:block;margin:8px 0 4px;font-size:16px}
.lvl p{font-size:13.5px;color:var(--ink-2);margin:0 0 8px}
.lvl .tier{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:8px}
.lvl.hot{border-color:var(--accent);background:var(--accent-wash)}

/* competency library */
.lib .card ul{margin:8px 0 0;padding-inline-start:0;list-style:none}
.lib .card li{padding:7px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.lib .card li code{font:600 12.5px var(--sans);color:var(--accent-ink);margin-inline-end:6px}
.lib .fam{font-size:13px;color:var(--ink-3);margin-bottom:6px}

/* heat */
.heat td,.heat th{padding:8px 6px;text-align:center;font-size:13.5px}
.heat th:first-child,.heat td:first-child{text-align:start;padding-inline:14px;white-space:nowrap}
.heat td.c{font-variant-numeric:tabular-nums;font-weight:600;min-width:34px}
.heat .grp{font-size:11.5px;color:var(--ink-3);font-weight:500}
.legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:10px}
.legend i{display:inline-block;width:22px;height:14px;border-radius:3px}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.steps li{position:relative;padding:18px 18px 18px;border:1px solid var(--line);background:var(--surface);margin-inline-end:-1px}
.steps li:first-child{border-start-start-radius:10px;border-end-start-radius:10px}
.steps li:last-child{border-start-end-radius:10px;border-end-end-radius:10px}
.steps li::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--surface);font:600 14px var(--sans);margin-bottom:10px}
.steps b{display:block;font-size:15.5px;margin-bottom:4px}
.steps span{font-size:13.5px;color:var(--ink-2);line-height:1.55;display:block}
.loop{font-size:13px;color:var(--ink-3);margin-top:10px}

.formula{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.formula .eq{direction:ltr;text-align:center;font:500 22px/1.6 "Cambria Math","STIX Two Math","Times New Roman",serif;margin:6px 0 14px;color:var(--ink)}
.formula dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14.5px}
.formula dt{font-family:"Cambria Math","Times New Roman",serif;font-weight:600;direction:ltr}
.formula dd{margin:0;color:var(--ink-2)}

/* 2x2 */
.mx{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:1fr 1fr 28px;gap:8px;min-height:340px}
.mx .q{border-radius:10px;padding:16px 18px;background:var(--surface);border:1px solid var(--line)}
.mx .q.hot{background:var(--accent-wash);border:2px solid var(--accent)}
.mx .q b{display:block;font-size:16px;margin-bottom:4px}
.mx .q span{font-size:13.5px;color:var(--ink-2)}
.mx .ax{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.mx .ay{writing-mode:vertical-rl;transform:rotate(180deg)}
html[dir="rtl"] .mx .ay{transform:none}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;position:relative}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 20px}
.ph.now{border:2px solid var(--accent);background:var(--accent-wash)}
.ph .tag{font-size:12.5px;color:var(--ink-3)}
.ph h4{font-size:18px;margin:2px 0 2px}
.ph .when{font-size:13.5px;color:var(--accent-ink);font-weight:500;margin-bottom:10px}
.ph ul{margin:0;padding-inline-start:18px;font-size:14px;color:var(--ink-2)}
.ph .here{display:inline-block;font-size:11.5px;font-weight:600;color:var(--surface);background:var(--accent);border-radius:999px;padding:1px 9px;margin-bottom:6px}
.gates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:14px;position:relative}
.gates::before{content:"";position:absolute;inset-inline:0;top:11px;height:1px;background:var(--line-2)}
.gate{position:relative;text-align:center;grid-column:span 1}
.gate .d{width:22px;height:22px;transform:rotate(45deg);background:var(--surface-2);border:1.5px solid var(--ink-3);margin:0 auto 10px}
.gate b{display:block;font-size:14px}
.gate span{font-size:12.5px;color:var(--ink-3)}
.gate-slot{display:flex;justify-content:flex-end}
.gate-slot .gate{transform:translateX(50%);margin-inline-end:-8px}
html[dir="rtl"] .gate-slot .gate{transform:translateX(-50%)}

.list-clean{margin:0;padding-inline-start:20px;color:var(--ink-2)}
.list-clean li{margin-bottom:6px}
.callout{border-inline-start:3px solid var(--accent);background:var(--surface);padding:16px 20px;border-radius:0 8px 8px 0;margin-top:20px;font-size:15.5px;color:var(--ink-2)}
html[dir="rtl"] .callout{border-radius:8px 0 0 8px}
.callout b{color:var(--ink)}

.sources ol{columns:2;column-gap:40px;margin:0;padding-inline-start:22px;font-size:14px}
.sources li{break-inside:avoid;margin-bottom:8px;color:var(--ink-2)}
.sources li span{display:block;font-size:12.5px;color:var(--ink-3)}
footer{padding:36px 0 48px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}

/* progress meters */
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.meter .k{font-size:14px;color:var(--ink-2);font-weight:500}
.meter .v{font:600 30px/1.2 var(--cond);margin:6px 0 10px;font-variant-numeric:tabular-nums}
html[lang="ar"] .meter .v{font-family:var(--arab)}
.meter .v small{font-size:15px;color:var(--ink-3);font-weight:500}
.bar{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter .s{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.5}

/* evidence hierarchy */
.hier{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.hier li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 12px 14px;position:relative}
.hier li:nth-child(-n+3){background:var(--accent-wash);border-color:transparent}
.hier b{display:block;font-size:14px;margin-bottom:3px}
.hier span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.hier .r{font:600 12px var(--sans);color:var(--accent-ink)}

/* audience architecture */
.aud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.aud .card{display:flex;flex-direction:column;gap:6px}
.aud .lv{font-size:12.5px;color:var(--ink-3)}
.aud .card h4{font-size:17px}
.aud .mode{margin-top:auto;font-size:13px;color:var(--accent-ink);border-top:1px solid var(--line);padding-top:8px}
.aud .card.front{border-color:var(--accent)}

/* radar */
.radar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.radar .card h4{display:flex;justify-content:space-between;gap:8px;align-items:baseline}

/* scoring model */
.score{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch}
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.crit:first-child{border-top:0}
.crit label{font-size:14.5px;font-weight:500}
.crit .w{font-size:12.5px;color:var(--ink-3)}
.crit input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.crit output{font:600 15px var(--sans);font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.result{background:var(--accent-wash);border-radius:10px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.result .big{font:700 52px/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--accent-ink)}
html[lang="ar"] .result .big{font-family:var(--arab)}
.result .band-l{font-size:15px;font-weight:600}

/* evaluation ladder */
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.ladder li{background:var(--accent-wash);border-radius:8px 8px 0 0;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}
.ladder b{font-size:14px}

function pillarChart(DATA = PILLARS, N = 83, overall = 14, hotKeys = ['talent'], ticks = [1, 20, 40, 60, 83], aria = T('ترتيب المملكة حسب المحاور الفرعية','Saudi rank by sub-pillar'), overallLbl = T('الترتيب العام: 14','Overall rank: 14')) {
  const W = 760, rtl = lang === 'ar', y0 = 54, step = 36;
  const left = rtl ? 40 : 210, right = rtl ? 540 : 720;
  const X = r => rtl ? right - (r - 1) / (N - 1) * (right - left) : left + (r - 1) / (N - 1) * (right - left);
  const H = y0 + step * DATA.length + 30;
  const yEnd = y0 + step * (DATA.length - 1) + 16;
  const labX = rtl ? W - 24 : left - 16;
  let s = `<svg viewBox="0 0 ${W} ${H}" style="direction:ltr" role="img" aria-label="${tx(aria)}">`;
  ticks.forEach(t => { s += `<line x1="${X(t)}" x2="${X(t)}" y1="32" y2="${yEnd}" stroke="var(--line)"/><text x="${X(t)}" y="22" text-anchor="middle" font-size="12" style="fill:var(--ink-3)">${t}</text>`; });
  s += `<line x1="${X(overall)}" x2="${X(overall)}" y1="32" y2="${yEnd}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>`;
  s += `<text x="${X(overall)}" y="${yEnd + 20}" text-anchor="middle" font-size="12" style="fill:var(--ink-3)">${tx(overallLbl)}</text>`;
  DATA.forEach(([k, name, r], i) => {
    const y = y0 + i * step, hot = hotKeys.includes(k), c = hot ? 'var(--gap-fill)' : 'var(--muted-mark)';
    s += `<text x="${labX}" y="${y + 5}" text-anchor="end" font-size="14.5" style="fill:${hot ? 'var(--ink)' : 'var(--ink-2)'};font-weight:${hot ? 600 : 400}">${tx(name)}</text>`;
    s += `<line x1="${X(1)}" x2="${X(r)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="2.5"/>`;
    s += `<circle cx="${X(r)}" cy="${y}" r="7" fill="${c}"><title>${tx(name)}: ${r} / ${N}</title></circle>`;
    s += `<text x="${X(r) + (rtl ? -14 : 14)}" y="${y + 5}" text-anchor="${rtl ? 'end' : 'start'}" font-size="14.5" style="fill:${hot ? 'var(--gap)' : 'var(--ink-2)'};font-weight:${hot ? 700 : 500}">${r}</text>`;
  });
  return s + '</svg>';
}

function heatCell(v) {
  if (!v) return `<td class="c" style="color:var(--ink-3)">·</td>`;
  const pct = [0, 14, 30, 50, 72, 92][v];
  const ink = v >= 4 ? 'var(--surface)' : 'var(--ink)';
  return `<td class="c" style="background:color-mix(in srgb, var(--accent) ${pct}%, var(--surface));color:${ink}">${v}</td>`;
}

          <li><b>${tx(T('القطاع العام مقابل الخاص','Public vs private'))}</b> — ${tx(T('خريطتان منفصلتان؛ فجوات الحكومة توجّه برامج الأكاديمية، وفجوات القطاع الخاص توجّه الاستثمار المشترك والمسارات المدعومة من «هدف».','separate heat maps; government gaps drive Academy programs, private gaps drive co-investment and HRDF-supported pathways.'))}</li>

          <li><b>${tx(T('المستوى','Level'))}</b> — ${tx(T('ثقافة، ممارس، مختص، خبير، قيادة.','literacy, practitioner, specialist, expert, leadership.'))}</li>
          <li><b>${tx(T('الفئات','Demographics'))}</b> — ${tx(T('الجنس والمنطقة لتتبع مؤشرات الشمول.','gender and region, to track inclusion KPIs.'))}</li>
        </ul></div>
      <div class="card"><h4>${tx(T('حوكمة البيانات','Data governance'))}</h4><p>${tx(T('تبقى النتائج الفردية لدى الجهة، ولا تنشر المنصة إلا نتائج مجمّعة، بحد أدنى لحجم الخلية يُحدَّد مع مستشاري حماية البيانات الشخصية. تحصل كل جهة على ملف فجواتها مقارنةً بنظيراتها في القطاع.','Individual results stay with the entity; the portal publishes aggregates only, with a minimum cell size set with data-protection counsel. Each entity receives its own gap profile against sector peers.'))}</p></div>
    </div>
  </div></section>`);

  /* ---------- 5. roadmap ---------- */
  m.push(`<section class="band" id="roadmap" aria-labelledby="h-roadmap"><div class="wrap">
    ${head('roadmap', T('6 · التنفيذ','6 · Execution'), T('المرحلة الأولى تبدأ الآن: خطوط الأساس قبل التوسع','Phase 1 starts now: baselines before scale'),
      T('تنقل الخارطة الاستثمار من التوعية الشاملة — التي تحققت إلى حد كبير عبر «سماي» — إلى مسارات المختصين والخبراء حسب الدور، وهي الطبقة التي يعتمد عليها مستهدف 20,000 ومحور المواهب في المؤشرات الدولية.','The roadmap shifts investment from mass literacy, largely delivered through SAMAI, to role-based specialist and expert pipelines — the tier the 20,000 target and the talent indices depend on.'),
      T('ماذا نفعل، وبأي ترتيب، وكيف نعرف أنه ينجح؟','What do we do, in what order, and how do we know it is working?'))}
    <div class="road">${PHASES.map(p => `<div class="ph${p.now ? ' now' : ''}">${p.now ? `<span class="here">${tx(T('نحن هنا','You are here'))}</span>` : ''}<div class="tag">${tx(T('المرحلة','Phase'))} ${p.n}</div><h4>${tx(p.name)}</h4><div class="when">${tx(p.when)}</div><ul>${p.items.map(i => `<li>${tx(i)}</li>`).join('')}</ul></div>`).join('')}</div>
    <div class="gates" aria-hidden="false">${GATES.map(([a, b]) => `<div class="gate-slot"><div class="gate"><div class="d"></div><b>${tx(a)}</b><span>${tx(b)}</span></div></div>`).join('')}<div></div></div>
    <p class="loop">${tx(T('لا تتوسع أي مرحلة قبل اجتياز بوابتها: تُطلق ميزانية المرحلة الثانية بعد اعتماد خطوط الأساس فقط.','No phase scales before its gate: Phase 2 funding is released only once Wave 1 baselines are approved.'))}</p>

    <div class="block">
      <div class="sub-h"><h3>${tx(T('نموذج التنفيذ حسب الغرض','Delivery model by purpose'))}</h3><p>${tx(T('لكل نمط تعلّم دليل إنجاز مختلف؛ فالتعلّم الذاتي يرفع الوعي بكفاءة لكنه لا يُنتج إتقانًا مهنيًا يعادل العمل الهندسي المُشرف عليه. المدد توصيات تخطيطية لا معايير دولية. اتجاه 2026: مسارات قابلة للتراكم وشهادات مصغّرة يصممها أصحاب العمل. وتُقاس جودة البرامج على إطار سدايا لمعايير البرامج التدريبية.','Each mode carries different evidence of achievement: self-paced learning raises awareness efficiently but does not produce the proficiency of supervised engineering work. Durations are planning recommendations, not international standards. The 2026 direction: stackable pathways and employer-designed micro-credentials. Program quality is judged against SDAIA’s Training Programs Standards Framework.'))}</p></div>
      ${table([T('النمط','Mode'), T('المدة','Duration'), T('الأنسب لـ','Best for'), T('دليل الإنجاز','Evidence of achievement')], MODES.map(([a, b, c, d]) => tr([`<b>${tx(a)}</b>`, `<span class="num">${tx(b)}</span>`, tx(c), tx(d)])))}
      <p class="src">${tx(T('المصادر: ','Sources: '))}${cite('tpsf', 'oecdMc', 'athka')}</p>
    </div>

    <div class="block">
      <div class="sub-h"><h3>${tx(T('سلّم قياس الأثر','Impact measurement ladder'))}</h3><p>${tx(T('لا يُحتسب خريج معسكر هندسة الذكاء الاصطناعي متقنًا للنشر لمجرد حصوله على الشهادة؛ يتطلب ذلك مهام هندسية ناجحة واختبارات وتوثيقًا وضوابط تشغيلية.','An AI engineering bootcamp graduate is not counted deployment-proficient just for holding a certificate; that requires successful engineering tasks, testing, documentation and operational controls.'))}</p></div>
      <ol class="ladder">${LADDER.map(([a, b, c], i) => `<li style="min-height:${96 + i * 18}px"><b>${tx(a)}</b><span>${tx(b)}</span><em>${tx(c)}</em></li>`).join('')}</ol>
    </div>

    <div class="block">
      <div class="sub-h"><h3>${tx(T('منتجات إدارة التخطيط','Planning department products'))}</h3><p>${tx(T('مجموعة صغيرة من المنتجات المرجعية المحدّثة بانتظام تجعل الإدارة المصدر المعتمد لتخطيط القدرات.','A small set of authoritative, regularly maintained products that make the department the reference source for capability planning.'))}</p></div>
      ${table([T('المنتج','Product'), T('المحتوى','Contents'), T('الدورية','Cadence')], PRODUCTS.map(([a, b, c]) => tr([`<b>${tx(a)}</b>`, tx(b), tx(c)])))}
    </div>

    <div class="block">
      <div class="sub-h"><h3>${tx(T('إطار المبادرات','Initiative framework'))}</h3><p>${tx(T('كل مبادرة مرتبطة بالطبقة التي تخدمها، وبمربع الفجوة، وبالمؤشرات التي تحركها.','Each initiative is tied to the tier it serves, its gap quadrant and the KPIs it moves.'))}</p></div>
      ${table([T('المبادرة','Initiative'), T('الطبقة','Tier'), T('مربع الفجوة','Gap quadrant'), T('المؤشرات','KPIs'), T('نموذج التنفيذ','Delivery'), T('المرحلة','Phase')], INITS.map(r => tr([`<b>${tx(r[0])}</b>`, tx(r[1]), tx(r[2]), `<span class="num" dir="ltr">${r[3]}</span>`, tx(r[4]), `<span class="num">${tx(r[5])}</span>`])))}
      <p class="src">${tx(T('خيارات الشراكة متاحة: نما تحالف ITU لمهارات الذكاء الاصطناعي من 25 شريكًا مؤسسًا إلى أكثر من 70 جهة في عامه الأول، وأطلقت اليونسكو RAM 2.0 في الرياض في سبتمبر 2026. ','Partnership options are live: ITU’s AI Skills Coalition grew from 25 founding partners to 70+ organisations in its first year, and UNESCO launched RAM 2.0 in Riyadh in September 2026. '))}${cite('itu', 'ram2')}</p>
    </div>

    <div class="block grid2" style="align-items:start">
      <div class="card"><h4>${tx(T('حوكمة التنفيذ','Execution governance'))}</h4>
        <ul class="list-clean">
          <li><b>${tx(T('التوجيه:','Steering:'))}</b> ${tx(T('مراجعة ربع سنوية من قيادة قطاع بناء القدرات مقابل لوحة المؤشرات، وتُسجَّل قرارات البوابات في المنصة.','quarterly review by Capacity Building Sector leadership against the KPI scorecard; gate decisions recorded on the portal.'))}</li>
          <li><b>${tx(T('قاعدة التمويل:','Funding rule:'))}</b> ${tx(T('تُموَّل البرامج بقدر الفجوة المرجّحة التي تسدها، لا بعدد الملتحقين.','programs are funded in proportion to the weighted gap they close, not enrolment volume.'))}</li>
          <li><b>${tx(T('التصحيح:','Course correction:'))}</b> ${tx(T('أي مبادرة متأخرة ربعين متتاليين عن مؤشرها الرئيس يُعاد تصميمها أو تُوقف.','any initiative two quarters off track on its lead KPI is redesigned or retired.'))}</li>
        </ul></div>
      <div>
        <div class="sub-h"><h3>${tx(T('المخاطر الرئيسة','Key risks'))}</h3></div>
        ${table([T('الخطر','Risk'), T('المعالجة','Mitigation')], RISKS.map(([a, b]) => tr([`<b>${tx(a)}</b>`, tx(b)])))}
      </div>
    </div>
  </div></section>`);

  /* ---------- sources ---------- */
  m.push(`<section class="band sources" id="sources" aria-labelledby="h-sources"><div class="wrap">
    ${head('sources', T('المرجعية','Evidence'), T('المصادر والمنهجية','Sources and method'),
      T('يظهر لكل رقم ناشره وسنة إصداره. قبل الإطلاق الرسمي تُستبدل التغطيات الصحفية بالمصادر الأولية (سدايا، واس، الجهة الناشرة للمؤشر)، وتُميَّز أي قيمة أقدم من آخر إصدار لمؤشرها.','Every figure shows its publisher and edition. Before official launch, press coverage is replaced by primary sources (SDAIA, SPA, the index publisher), and any figure older than its index’s latest edition is flagged.'),
      T('هل يمكن التحقق من كل رقم؟','Can every figure be checked?'))}
    <div class="callout" style="margin:0 0 28px"><b>${tx(T('أولوية التحقق قبل الإطلاق: ','Verify before launch: '))}</b>${tx(T('أرقام التعرض للذكاء الاصطناعي المنسوبة لتقرير المادة الرابعة 2026 (45% · 80% · 30%)، وترتيب المملكة في مؤشر الذكاء الاصطناعي المسؤول 2026 (67)، والترتيب العام في مؤشر أكسفورد 2025 (15)، ودرجة مؤشر صندوق النقد AIPI (مصدر ثانوي)، ومقاييس ستانفورد 2026 (من التغطية الصحفية)، وأرقام edX (تقدير ذاتي للقادة من مصدر ثانوي)، وأي إصدار من مؤشر Tortoise بعد 2024. ويُطابَق رقم 17,334 مع تعريف «المستوى 4 فأعلى».','the AI-exposure figures attributed to the 2026 Article IV (45% · 80% · 30%), the Responsible AI Index 2026 rank (67th), Oxford 2025 overall rank (15th), the IMF AIPI score (secondary), Stanford 2026 metrics (from press coverage), the edX figures (leaders’ self-assessment, secondary source), and any post-2024 Tortoise edition. Reconcile the 17,334 figure to the Level 4+ definition.'))}</div>
    <ol>${SRC_ORDER.map(k => `<li><a href="${SRC[k].u}" target="_blank" rel="noopener">${SRC[k].t}</a><span>${SRC[k].p}</span></li>`).join('')}</ol>
  </div></section>`);

  m.push(`<footer><div class="wrap">${tx(T('قطاع بناء القدرات · الهيئة السعودية للبيانات والذكاء الاصطناعي (سدايا) · إدارة التخطيط. وثيقة عمل لأغراض التخطيط؛ المستهدفات المقترحة بانتظار الاعتماد.','Capacity Building Sector · Saudi Data & AI Authority (SDAIA) · Planning Department. Working reference for planning; proposed targets pending approval.'))} · ${tx(UI.asof)}</div></footer>`);

  document.getElementById('main').innerHTML = m.join('');
  labelButtons();
  observe();
}

function scoreVal() { return CRIT.reduce((a, [k, , w]) => a + critVals[k] / 5 * w, 0); }
function scoreBand(v) { return v >= 80 ? T('تحرّك الآن','Act now') : v >= 60 ? T('ابنِ أو احمِ','Build or protect') : T('راقب','Monitor'); }
document.addEventListener('input', e => {
  const c = e.target.closest('[data-crit]'); if (!c) return;
  critVals[c.dataset.crit] = +c.value;
  document.getElementById('o-' + c.dataset.crit).textContent = c.value + '/5';
  document.getElementById('scoreV').textContent = scoreVal().toFixed(1);
  document.getElementById('scoreB').textContent = tx(scoreBand(scoreVal()));
});

function qHtml(q) { return `<b>${tx(q.n)}</b><span>${tx(q.d)}</span>`; }

/* ---------------- interactions ---------------- */
const root = document.documentElement;
try { const t = localStorage.getItem('plan-theme'); if (t) root.setAttribute('data-theme', t); } catch (e) {}
const isDark = () => { const t = root.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
function labelButtons() {
  document.querySelectorAll('[data-theme-toggle]').forEach(b => { b.textContent = isDark() ? tx(UI.themeLight) : tx(UI.themeDark); });
  document.querySelectorAll('[data-lang-toggle]').forEach(b => { b.textContent = tx(UI.langBtn); b.lang = lang === 'ar' ? 'en' : 'ar'; });
}
document.addEventListener('click', e => {
  const th = e.target.closest('[data-theme-toggle]');
  if (th) { const n = isDark() ? 'light' : 'dark'; root.setAttribute('data-theme', n); try { localStorage.setItem('plan-theme', n); } catch (er) {} labelButtons(); return; }
  const lg = e.target.closest('[data-lang-toggle]');
  if (lg) { const y = scrollY; lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('plan-lang', lang); } catch (er) {} render(); scrollTo(0, y); return; }
  const k = e.target.closest('[data-kpi]');
  if (k) { const y = scrollY; kpiFilter = k.dataset.kpi; render(); scrollTo(0, y); return; }
  const r = e.target.closest('[data-role]');
  if (r) { const y = scrollY; roleFilter = r.dataset.role; render(); scrollTo(0, y); }
});

let io;
function observe() {
  if (io) io.disconnect();
  if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const id = en.target.id;
      document.querySelectorAll('[data-id]').forEach(a => a.setAttribute('aria-current', a.dataset.id === id ? 'true' : 'false'));
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  SECTIONS.forEach(([id]) => { const el = document.getElementById(id); if (el) io.observe(el); });
}

render();
</script>
