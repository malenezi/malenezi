description: A shared on-ramp that builds a common language across AI, machine learning, generative AI,
  and the data value chain. Participants learn how modern AI systems create value, where they fail, and
  how data-driven decisions are made in organisations. The module anchors all subsequent pathways and
  requires no technical background.
description_ar: بوابة مشتركة تبني لغة موحدة حول الذكاء الاصطناعي وتعلم الآلة والذكاء الاصطناعي التوليدي
  وسلسلة قيمة البيانات. يتعرف المشاركون على كيفية تحقيق أنظمة الذكاء الاصطناعي للقيمة ومواطن إخفاقها وكيفية
  اتخاذ القرارات المبنية على البيانات، دون الحاجة لخلفية تقنية.
learning_outcomes:
- Explain core AI, ML, and generative-AI concepts and their business applications in plain language
- Differentiate between rule-based systems, machine learning, deep learning, and generative AI
- Analyze the data value chain from collection to decision within an organisational context
- Evaluate AI use cases for feasibility, value, and risk using a structured framework
- Identify common failure modes, biases, and limitations of AI systems
- Interpret basic data visualisations and model outputs to support decisions
topics:
- The AI, ML, and generative-AI landscape and terminology
- 'How machine learning works: data, models, predictions'
- The data value chain and data-driven decision-making
- Generative AI and large language models in the workplace
- AI opportunity and risk assessment frameworks
- National AI strategy context (NSDAI) and workforce roles
- 'Hands-on: exploring AI tools and reading model outputs'
assessment: Quizzes; use-case evaluation exercise
next_modules: SDA-FND-102 / SDA-FND-103
stackability: Entry badge; counts toward all certificates and both role tracks.
