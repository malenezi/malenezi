description: A practical module covering the full journey from raw data to analysis-ready insight. Participants
  query relational databases with SQL, clean and reshape messy datasets, engineer features, and conduct
  rigorous exploratory data analysis. The module instils the data-quality discipline every AI and analytics
  role depends on.
description_ar: وحدة عملية تغطي الرحلة الكاملة من البيانات الخام إلى الرؤى الجاهزة للتحليل. يستعلم المشاركون
  من قواعد البيانات العلائقية باستخدام SQL، وينظفون البيانات ويعيدون تشكيلها، ويبنون الخصائص، وينفذون
  تحليلًا استكشافيًا دقيقًا يرسّخ انضباط جودة البيانات الذي تعتمد عليه كل أدوار الذكاء الاصطناعي والتحليلات.
learning_outcomes:
- Design and execute SQL queries including joins, aggregations, and window functions
- Diagnose data-quality issues and implement systematic cleaning strategies
- Transform and reshape datasets for analysis using pandas
- Engineer meaningful features from raw structured data
- Conduct exploratory data analysis to surface patterns, anomalies, and relationships
- Communicate EDA findings through clear visual and written summaries
topics:
- Relational databases and SQL fundamentals
- 'Advanced SQL: joins, aggregation, window functions'
- Data-quality assessment and cleaning workflows
- Reshaping, merging, and transforming datasets
- Feature engineering for analytics and ML
- Exploratory data analysis and visual profiling
- EDA case study on a real government-style dataset
assessment: SQL labs; EDA project with report
next_modules: SDA-FND-105 and role-track entry
stackability: Foundation badge; required for Data Scientist track, recommended for AI Engineer track.
