description: A practical module on working productively and safely with generative-AI tools. Participants
  master prompt design patterns, output evaluation, and workflow integration for text, code, and data
  tasks. It equips every professional to use LLM-based assistants responsibly and effectively.
description_ar: وحدة تطبيقية للعمل بإنتاجية وأمان مع أدوات الذكاء الاصطناعي التوليدي. يتقن المشاركون أنماط
  تصميم الأوامر وتقييم المخرجات ودمجها في مهام النصوص والبرمجة والبيانات، بما يمكّن كل مهني من استخدام
  المساعدات الذكية بمسؤولية وفاعلية.
learning_outcomes:
- Explain how large language models generate output and why they hallucinate
- Design effective prompts using role, context, format, and few-shot patterns
- Apply iterative prompt refinement to improve output quality and reliability
- Evaluate generative-AI outputs for accuracy, bias, and appropriateness
- Integrate generative-AI assistants into document, analysis, and coding workflows
- Assess data-privacy and confidentiality risks when using AI tools
topics:
- 'How LLMs work: tokens, context, and limitations'
- Prompt design patterns and structured prompting
- Iterative refinement and prompt evaluation
- GenAI for documents, analysis, and code
- Hallucination, bias, and output verification
- Safe and compliant use of AI tools at work
- Hands-on prompt engineering lab
assessment: Prompt-portfolio project; practical exercises
next_modules: SDA-FND-103 or role-track modules
stackability: Foundation badge; recommended before all GenAI engineering modules.
