description: An intensive hands-on module that builds job-ready Python skills for data and AI work. Participants
  progress from core language constructs to scientific computing with NumPy and pandas, version control,
  and clean, testable code. It is the technical gateway to both the AI Engineer and Data Scientist tracks.
description_ar: وحدة تطبيقية مكثفة تبني مهارات بايثون الجاهزة لسوق العمل في مجالي البيانات والذكاء الاصطناعي.
  يتدرج المشاركون من أساسيات اللغة إلى الحوسبة العلمية باستخدام NumPy وPandas والتحكم بالإصدارات وكتابة
  كود نظيف قابل للاختبار، وهي البوابة التقنية لمساري مهندس الذكاء الاصطناعي وعالم البيانات.
learning_outcomes:
- Develop structured Python programs using functions, data structures, and object-oriented design
- Implement data manipulation and numerical computation workflows with pandas and NumPy
- Apply version control with Git and collaborative repository workflows
- Debug, test, and refactor Python code using systematic practices
- Build reusable scripts and notebooks for data acquisition and processing
- Organise projects with virtual environments and dependency management
topics:
- 'Python core: types, control flow, functions, OOP'
- Data structures and file/API data handling
- NumPy arrays and vectorised computation
- pandas for tabular data manipulation
- Git, GitHub, and collaboration workflows
- Testing, debugging, and code quality
- Environments and dependency management
- 'Mini-project: end-to-end data processing pipeline'
assessment: Daily labs; coding assignments; mini-project
