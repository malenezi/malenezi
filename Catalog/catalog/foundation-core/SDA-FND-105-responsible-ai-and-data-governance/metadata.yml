description: A governance-focused module aligning practice with Saudi national frameworks including PDPL,
  NDMO data standards, and SDAIA AI-ethics principles. Participants learn to assess fairness, transparency,
  privacy, and accountability across the AI lifecycle. The module prepares professionals to build and
  operate AI systems that are compliant and trustworthy by design.
description_ar: وحدة متخصصة في الحوكمة تواءم الممارسة مع الأطر الوطنية السعودية بما فيها نظام حماية البيانات
  الشخصية ومعايير مكتب إدارة البيانات الوطنية ومبادئ أخلاقيات الذكاء الاصطناعي الصادرة عن سدايا. يتعلم
  المشاركون تقييم العدالة والشفافية والخصوصية والمساءلة عبر دورة حياة الذكاء الاصطناعي لبناء أنظمة موثوقة
  ومتوافقة تصميمًا.
learning_outcomes:
- Explain Saudi data-protection requirements (PDPL) and NDMO governance standards
- Apply SDAIA AI-ethics principles across the AI system lifecycle
- Analyze AI systems for bias, fairness, and disparate impact
- Evaluate privacy risks and apply data-minimisation and anonymisation techniques
- Design documentation, model cards, and audit trails for accountable AI
- Assess third-party AI services for compliance and risk
topics:
- The responsible-AI landscape and SDAIA ethics principles
- PDPL and NDMO data-governance frameworks
- Bias, fairness, and impact assessment
- Privacy-preserving data handling
- Transparency, explainability, and documentation
- AI risk management and compliance workflows
- 'Case studies: governance in government AI deployments'
assessment: Governance case analysis; compliance-assessment exercise
next_modules: Role-track modules
stackability: Foundation badge; required for Expert-level certificates in both tracks.
