description: A specialist module on modelling data that evolves over time. Participants decompose series,
  build statistical and ML-based forecasting models, and evaluate them with time-aware backtesting. Applications
  include demand planning, workforce projections, and economic indicators relevant to national programmes.
description_ar: وحدة تخصصية في نمذجة البيانات المتغيرة عبر الزمن. يفكك المشاركون السلاسل ويبنون نماذج
  تنبؤ إحصائية وقائمة على تعلم الآلة ويقيّمونها باختبار رجعي مراعٍ للزمن، مع تطبيقات تشمل تخطيط الطلب
  وإسقاطات القوى العاملة والمؤشرات الاقتصادية ذات الصلة بالبرامج الوطنية.
learning_outcomes:
- Analyze trend, seasonality, and autocorrelation structure in time series
- Develop classical forecasting models including ARIMA and exponential smoothing
- Implement ML and gradient-boosting approaches with engineered temporal features
- Design backtesting frameworks with proper time-based validation
- Evaluate forecasts using scale-appropriate accuracy and uncertainty metrics
- Compare model families to select the right approach per use case
topics:
- Time-series structure and decomposition
- Stationarity and autocorrelation
- ARIMA and exponential smoothing
- Feature-based ML forecasting
- Probabilistic forecasts and intervals
- Backtesting and forecast evaluation
- Forecasting case study
assessment: Forecasting project with backtest report
