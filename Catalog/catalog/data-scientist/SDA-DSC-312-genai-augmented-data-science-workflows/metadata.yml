description: An expert module on multiplying data-science productivity with generative AI. Participants
  use LLMs for code generation, automated EDA, synthetic data, and unstructured-text analysis, while building
  reproducible, verifiable workflows. The module defines the professional standard for responsible AI-assisted
  analysis.
description_ar: وحدة خبراء لمضاعفة إنتاجية علم البيانات بالذكاء التوليدي. يستخدم المشاركون النماذج اللغوية
  لتوليد الكود والتحليل الاستكشافي الآلي والبيانات الاصطناعية وتحليل النصوص غير المهيكلة مع بناء سير عمل
  قابل للتكرار والتحقق، وتحدد الوحدة المعيار المهني للتحليل المسؤول المدعوم بالذكاء الاصطناعي.
learning_outcomes:
- Integrate AI coding assistants into analysis workflows with verification discipline
- Apply LLMs to extract structure and insight from unstructured text data
- Develop synthetic-data strategies for augmentation and privacy protection
- Design reproducible, version-controlled analysis pipelines with AI assistance
- Evaluate AI-generated analytical artefacts for correctness and bias
- Implement agent-assisted automation for recurring analytics tasks
topics:
- AI-assisted coding and analysis patterns
- LLMs for text analytics and feature extraction
- Synthetic data generation and privacy
- Reproducibility and verification discipline
- Automating recurring analytics with agents
- Responsible use and quality assurance
assessment: Augmented-workflow project with verification report
