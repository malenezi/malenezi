description: A rigorous, applied grounding in the statistics that underpin trustworthy data science. Participants
  master probability, distributions, estimation, hypothesis testing, and regression, applying each concept
  computationally in Python. The module builds the inferential judgement needed to draw valid conclusions
  from data.
description_ar: تأسيس تطبيقي دقيق في الإحصاء الذي يقوم عليه علم البيانات الموثوق. يتقن المشاركون الاحتمالات
  والتوزيعات والتقدير واختبار الفرضيات والانحدار مع تطبيق كل مفهوم حاسوبيًا في بايثون، بما يبني الحكم
  الاستدلالي اللازم لاستخلاص نتائج صحيحة من البيانات.
learning_outcomes:
- Apply probability rules and distributions to model real-world uncertainty
- Analyze sampling variability using confidence intervals and standard errors
- Implement hypothesis tests and interpret p-values and effect sizes correctly
- Develop linear and logistic regression models and diagnose their assumptions
- Evaluate statistical claims for common fallacies and misuse
- Simulate statistical processes computationally to validate analytical results
topics:
- Probability and common distributions
- Descriptive statistics and sampling
- Estimation and confidence intervals
- Hypothesis testing and effect sizes
- Correlation, causation, and confounding
- Linear and logistic regression
- Simulation and resampling methods
assessment: Labs; statistical analysis project
