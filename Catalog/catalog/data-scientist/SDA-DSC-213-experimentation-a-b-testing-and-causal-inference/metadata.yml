description: A specialist module on answering "what actually works" with data. Participants design and
  analyse randomised experiments, compute power and sample sizes, and apply causal-inference methods —
  matching, difference-in-differences, and instrumental variables — when experiments are impossible. The
  module turns data scientists into trusted advisors on policy and product decisions.
description_ar: وحدة تخصصية للإجابة عن سؤال "ما الذي يحدث الأثر فعلًا" بالبيانات. يصمم المشاركون التجارب
  العشوائية ويحللونها ويحسبون القوة وأحجام العينات ويطبقون أساليب الاستدلال السببي — المطابقة والفروق
  في الفروق والمتغيرات الأداتية — حين تتعذر التجارب، بما يجعل عالم البيانات مستشارًا موثوقًا لقرارات السياسات
  والمنتجات.
learning_outcomes:
- Design randomised experiments with valid randomisation units and guardrail metrics
- Compute statistical power, sample sizes, and minimum detectable effects
- Analyze experiment results with correct variance estimation and multiple-testing control
- Apply quasi-experimental methods including matching and difference-in-differences
- Evaluate causal claims from observational data using DAG-based reasoning
- Communicate experimental evidence and uncertainty to decision-makers
topics:
- Causal thinking and potential outcomes
- Experiment design and randomisation
- Power analysis and sample sizing
- 'Analysis pitfalls: peeking, multiple testing'
- 'Quasi-experiments: matching, DiD, IV'
- Causal graphs and confounding
- Experimentation case study
assessment: Experiment design and analysis project
