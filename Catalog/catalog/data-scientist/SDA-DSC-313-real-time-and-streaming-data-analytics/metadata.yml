description: An expert module on analytics that cannot wait for batch jobs. Participants build streaming
  pipelines with Kafka and Spark Structured Streaming, implement windowed aggregations and real-time feature
  computation, and serve live metrics and alerts. The module completes the modern data stack for real-time
  AI applications.
description_ar: وحدة خبراء في التحليلات التي لا تحتمل انتظار المعالجة الدفعية. يبني المشاركون خطوط تدفق
  باستخدام Kafka وSpark Structured Streaming وينفذون التجميعات النافذية وحساب الخصائص اللحظي ويقدمون مقاييس
  وتنبيهات حية، بما يكمل منظومة البيانات الحديثة لتطبيقات الذكاء الاصطناعي اللحظية.
learning_outcomes:
- Design streaming architectures with appropriate delivery and consistency guarantees
- Implement event ingestion and processing with Kafka and Structured Streaming
- Develop windowed aggregations, joins, and stateful stream computations
- Build real-time feature pipelines serving online ML models
- Implement live dashboards, alerting, and anomaly detection on streams
- Evaluate latency, throughput, and correctness trade-offs in streaming systems
topics:
- Streaming architecture and event-driven design
- Kafka fundamentals and event modelling
- Spark Structured Streaming
- Windowing, watermarks, and state
- Real-time features for online ML
- Live monitoring and anomaly detection
- Streaming analytics project
assessment: Streaming pipeline project
