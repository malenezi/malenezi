description: An expert module that moves from predicting outcomes to prescribing actions. Participants
  formulate linear and integer optimisation models, run simulations under uncertainty, and combine ML
  predictions with optimisation to recommend optimal decisions. Applications span resource allocation,
  scheduling, and policy planning.
description_ar: وحدة خبراء تنتقل من التنبؤ بالنتائج إلى وصف الإجراءات. يصوغ المشاركون نماذج التحسين الخطي
  والصحيح وينفذون المحاكاة في ظل عدم اليقين ويجمعون تنبؤات تعلم الآلة مع التحسين للتوصية بالقرارات المثلى،
  مع تطبيقات في تخصيص الموارد والجدولة وتخطيط السياسات.
learning_outcomes:
- Formulate business problems as linear and integer optimisation models
- Implement optimisation solutions using modern solver frameworks
- Design simulations to evaluate decisions under uncertainty
- Integrate ML predictions into prescriptive decision pipelines
- Analyze trade-offs with sensitivity and scenario analysis
- Evaluate decision-support systems for robustness and adoption
topics:
- From predictive to prescriptive analytics
- Linear and integer programming
- Solver frameworks and model building
- Monte Carlo simulation
- Predict-then-optimise pipelines
- Sensitivity and scenario analysis
- Decision-science case project
assessment: Optimisation project with decision memo
