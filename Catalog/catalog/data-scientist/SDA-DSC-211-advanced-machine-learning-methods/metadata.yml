description: A specialist module that deepens modelling skill beyond the foundations. Participants master
  gradient-boosting frameworks, imbalanced and cost-sensitive learning, model interpretability with SHAP,
  and rigorous validation design. The emphasis is on winning reliable performance on messy, real-world
  tabular problems.
description_ar: وحدة تخصصية تعمّق مهارة النمذجة إلى ما بعد الأساسيات. يتقن المشاركون أطر التعزيز المتدرج
  والتعلم مع البيانات غير المتوازنة والحساسة للتكلفة وتفسير النماذج باستخدام SHAP وتصميم تحقق صارم، مع
  تركيز على تحقيق أداء موثوق في مشكلات جدولية واقعية معقدة.
learning_outcomes:
- Develop high-performance models with XGBoost and LightGBM
- Design validation schemes that respect leakage, grouping, and time order
- Apply techniques for imbalanced, noisy, and cost-sensitive problems
- Analyze model behaviour using SHAP and permutation importance
- Optimize feature pipelines and model ensembles for tabular data
- Evaluate models for stability, calibration, and business impact
topics:
- Gradient boosting deep dive
- Validation design and leakage prevention
- Imbalanced and cost-sensitive learning
- 'Model interpretability: SHAP and beyond'
- Calibration and uncertainty estimates
- Ensembling and stacking strategies
- Applied modelling challenge
assessment: Modelling challenge; interpretability report
next_modules: SDA-DSC-212 / SDA-DSC-213
