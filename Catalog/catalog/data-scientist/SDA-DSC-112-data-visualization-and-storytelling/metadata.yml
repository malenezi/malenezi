description: A craft-focused module on turning analysis into influence. Participants apply perception
  science to design honest, compelling visualisations, build interactive dashboards, and structure data
  narratives for executive audiences. The module closes the last mile between analytical work and organisational
  decisions.
description_ar: وحدة مهارية لتحويل التحليل إلى تأثير. يطبق المشاركون علم الإدراك لتصميم تصورات صادقة ومقنعة
  وبناء لوحات معلومات تفاعلية وهيكلة سرديات البيانات لجمهور تنفيذي، بما يغلق المسافة الأخيرة بين العمل
  التحليلي وقرارات المؤسسة.
learning_outcomes:
- Apply visual-perception principles to select effective chart types
- Design clear, honest visualisations that avoid distortion and clutter
- Develop interactive dashboards for self-service exploration
- Construct data narratives structured around audience and decision
- Evaluate visualisations through critique and iterative refinement
- Present analytical findings persuasively to executive stakeholders
topics:
- Perception science and visual encoding
- Chart selection and design principles
- Colour, annotation, and decluttering
- Interactive dashboards and BI tools
- Data storytelling structure and flow
- Executive communication and presentation lab
assessment: Dashboard project; storytelling presentation
