description: The integrative capstone of the Data Scientist pathway. Teams take an ambiguous organisational
  question through framing, data engineering, modelling, validation, and a decision-ready recommendation,
  defended before an expert panel. The project produces a portfolio-grade artefact demonstrating end-to-end
  professional competence.
description_ar: المشروع التكاملي الختامي لمسار عالم البيانات. تأخذ الفرق سؤالًا مؤسسيًا غامضًا عبر الصياغة
  وهندسة البيانات والنمذجة والتحقق وصولًا إلى توصية جاهزة للقرار تُعرض أمام لجنة خبراء، وينتج المشروع
  عملًا احترافيًا يثبت الكفاءة المهنية المتكاملة.
learning_outcomes:
- Frame an ambiguous organisational question as a tractable analytical problem
- Design and build the data pipeline supporting the analysis
- Develop and validate models with rigorous, leakage-free methodology
- Analyze results for robustness, fairness, and practical significance
- Construct a decision-ready recommendation with quantified uncertainty
- Defend methodology and findings before a technical panel
topics:
- Problem framing and scoping workshop
- Data acquisition and pipeline build
- Modelling and validation sprints
- Robustness, fairness, and sensitivity checks
- Decision memo and visual narrative
- Final presentation and panel defence
assessment: Portfolio project; decision memo; panel defence
