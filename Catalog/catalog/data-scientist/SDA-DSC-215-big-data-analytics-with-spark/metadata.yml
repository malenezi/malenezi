description: A specialist module on analysing datasets too large for a single machine. Participants master
  distributed computing concepts, write performant Spark transformations and SQL, and tune jobs through
  partitioning and caching. The module scales every prior analytics skill to enterprise data volumes.
description_ar: وحدة تخصصية لتحليل مجموعات البيانات التي تتجاوز قدرة جهاز واحد. يتقن المشاركون مفاهيم
  الحوسبة الموزعة وكتابة تحويلات Spark وSQL عالية الأداء وضبط المهام عبر التقسيم والتخزين المؤقت، بما
  يوسّع كل مهارات التحليل السابقة إلى أحجام البيانات المؤسسية.
learning_outcomes:
- 'Explain distributed execution: partitions, shuffles, and lazy evaluation'
- Develop analytical workloads with Spark DataFrames and Spark SQL
- Optimize job performance through partitioning, caching, and join strategies
- Implement scalable feature-engineering and ML pipelines with Spark MLlib
- Analyze query plans to diagnose and resolve performance bottlenecks
- Design batch analytics workflows on Lakehouse storage
topics:
- Distributed computing fundamentals
- Spark DataFrames and Spark SQL
- Shuffles, partitioning, and caching
- Performance tuning and query plans
- Spark MLlib pipelines at scale
- Big-data analytics project
