description: A comprehensive module on building modern, scalable, production-ready data architectures
  that feed AI and analytics. Participants trace the evolution from warehouses and lakes to the Lakehouse,
  master Delta Lake with ACID transactions and compute-storage separation, and work with ELT, streaming,
  data quality, and governance. A hands-on build of a local Mini-Lakehouse with Delta Lake and PySpark
  anchors the learning.
description_ar: وحدة شاملة لبناء معماريات بيانات حديثة قابلة للتوسع وجاهزة للإنتاج تغذي الذكاء الاصطناعي
  والتحليلات. يتتبع المشاركون التطور من المستودعات والبحيرات إلى معمارية Lakehouse ويتقنون Delta Lake
  مع معاملات ACID وفصل الحوسبة عن التخزين ويعملون مع ELT والتدفقات اللحظية وجودة البيانات والحوكمة، ويرسّخ
  التعلمَ تطبيقٌ عملي لبناء Mini-Lakehouse محلي باستخدام Delta Lake وPySpark.
learning_outcomes:
- Compare data warehouses, data lakes, and Lakehouse architectures across use cases
- Explain compute-storage separation and its impact on cost, elasticity, and scale
- Design ELT pipelines suited to modern cloud data environments
- Implement Delta Lake tables with ACID transactions and schema enforcement
- Develop streaming and event-driven ingestion patterns for real-time data
- Apply data-quality, observability, and governance controls across pipelines
- Build a working Mini-Lakehouse with Delta Lake and PySpark
- Connect Lakehouse components to AI, reporting, and analytics consumers
topics:
- 'Evolution of data architecture: warehouse, lake, Lakehouse'
- Compute-storage separation and cloud economics
- ETL versus ELT in modern stacks
- Delta Lake and ACID transactions
- Streaming data and event-driven architectures
- Data quality, observability, and governance
- 'Hands-on: building a Mini-Lakehouse'
- Serving data to AI and BI workloads
assessment: Labs; Mini-Lakehouse build project
next_modules: SDA-DSC-215 / SDA-DSC-313
