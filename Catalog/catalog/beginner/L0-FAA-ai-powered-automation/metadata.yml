description: This training program enables participants to understand the concept of AI-powered automation
  and apply it to simplify repetitive tasks in the workplace, without any programming background. The
  program focuses on identifying daily tasks suitable for automation and getting to know easy-to-use,
  no-code tools, with hands-on practice building simple workflows that combine AI tools to save time and
  effort and reduce errors. It also covers reviewing the results of automated tasks and assuring their
  quality, along with safe and responsible practices when automating work, so that participants leave
  with the practical ability to implement simple, safe automation for their daily tasks.
description_ar: يهدف هذا البرنامج التدريبي إلى تمكين المشاركين من فهم مفهوم الأتمتة المدعومة بالذكاء الاصطناعي
  وتوظيفها في تبسيط المهام المتكررة في بيئة العمل، دون الحاجة إلى أي خلفية برمجية. يركز البرنامج على تحديد
  المهام اليومية القابلة للأتمتة، والتعرف على الأدوات سهلة الاستخدام التي لا تتطلب كتابة كود، مع تدريب
  عملي على بناء تدفقات عمل بسيطة تجمع بين الأدوات الذكية لتوفير الوقت والجهد وتقليل الأخطاء. كما يتناول
  البرنامج مراجعة نتائج المهام المؤتمتة وضمان جودتها، والممارسات الآمنة والمسؤولة عند أتمتة الأعمال، ويخرج
  المشاركون بقدرة عملية على تنفيذ أتمتة بسيطة وآمنة لمهامهم اليومية.
learning_outcomes:
- Understand the concept of AI-powered automation and its benefits in the workplace.
- Identify repetitive daily tasks that are suitable for automation within one's role.
- Use easy, no-code automation tools to carry out simple work tasks.
- Build a simple workflow that combines AI tools to complete a repetitive task.
- Review the results of automated tasks and verify their quality and reliability.
- Apply safe and responsible practices when automating tasks in the work environment.
