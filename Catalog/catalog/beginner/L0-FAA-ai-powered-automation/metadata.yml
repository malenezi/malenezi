- Building a Simple Workflow
- Reviewing Results and Assuring Quality
- Safe and Responsible Use of Automation
topic_details:
  Introduction to AI-Powered Automation:
  - Understand the concept of automation and the difference between traditional automation and AI-powered
    automation.
  - Review realistic examples of office tasks that have been simplified using intelligent automation.
  - Understand the expected benefits of automation in saving time, reducing errors, and raising productivity.
  Identifying Tasks Suitable for Automation:
  - Practise analysing daily tasks and identifying those that are repetitive and automatable.
  - Estimate the effort and time that can be saved by automating each task.
  - Prioritise automation opportunities based on expected value and ease of implementation.
  Easy-to-Use Automation Tools:
  - Learn about common automation tools that require no code.
  - Explore the capabilities of AI assistants in carrying out repetitive tasks automatically.
  - Complete a hands-on exercise using a simple automation tool on a realistic office task.
  Building a Simple Workflow:
  - Understand the components of a workflow, including inputs, steps, and outputs.
  - Practise connecting more than one step or tool into a single integrated workflow.
  - Complete a practical exercise building a workflow that handles a repetitive workplace task.
  Reviewing Results and Assuring Quality:
  - Apply practical steps to review the outputs of automated tasks before approving them.
  - Recognise common automation errors and how to detect and fix them.
  - Understand the importance of keeping a human in charge of automated tasks and the final decision.
  Safe and Responsible Use of Automation:
  - Recognise the risks of sharing sensitive data with automation and AI tools.
  - Learn the basic controls for using automation in line with workplace policies.
  - Create a simple plan to apply automation to daily tasks gradually and safely.
