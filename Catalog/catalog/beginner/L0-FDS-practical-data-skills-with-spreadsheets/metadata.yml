- Sorting and Filtering
- Pivot Tables
- Charts
- 'Hands-On Application: Preparing a Data Report'
topic_details:
  Spreadsheet Fundamentals:
  - Get to know the spreadsheet interface and its components, including cells, rows, columns, and worksheets.
  - Practise the basic skills of navigating, selecting, copying, pasting, and formatting.
  - Understand best practices for saving, organising, and sharing files in the workplace.
  Entering and Organising Data:
  - Practise entering different types of data, including numbers, text, and dates, correctly.
  - Organise data into well-structured tables that can be analysed and filtered.
  - Apply data-validation rules to reduce errors during data entry.
  Basic Formulas and Functions:
  - Understand how to write formulas and use cell references.
  - Practise common functions such as sum, average, count, minimum, and maximum.
  - Apply basic conditional and lookup functions to realistic work tasks.
  Cleaning and Preparing Data:
  - Detect common data errors such as duplicates, missing values, and inconsistencies.
  - Practise text-handling tools, standardising formats, and removing duplicates.
  - Prepare data in a clean form that is ready for analysis and reporting.
  Sorting and Filtering:
  - Apply simple and multi-level sorting to arrange data as needed.
  - Use filtering to quickly extract specific categories of data.
  - Complete practical exercises answering work questions using sorting and filtering.
  Pivot Tables:
  - Understand the concept of a pivot table and its role in summarising large amounts of data.
  - Practise creating pivot tables and changing how summaries are displayed.
  - Draw quick insights from data by grouping and analysing it with pivot tables.
  Charts:
  - Learn the common chart types and when to use each one.
  - Practise creating and formatting charts to present data clearly.
  - Improve charts with titles, colours, and labels suited to the audience.
  'Hands-On Application: Preparing a Data Report':
  - Apply the acquired skills to a realistic dataset from cleaning through to summarising.
  - Prepare a simple report that brings tables, summaries, and charts together in one view.
  - Present and discuss the results and receive feedback to improve the quality of the report.
