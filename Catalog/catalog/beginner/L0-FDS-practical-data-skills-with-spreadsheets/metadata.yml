description: This training program enables participants to gain practical skills in working with data
  using spreadsheets, through a simple hands-on approach that requires no programming experience. The
  program focuses on the fundamentals of organising and entering data correctly, using basic formulas
  and functions, and cleaning and preparing data, before moving on to sorting, filtering, summarising
  data with pivot tables, and creating clear charts. Participants apply these skills through progressive
  practical exercises on realistic data, ending with the preparation of a simple, complete data report,
  enabling them to handle everyday data tasks in their work efficiently and confidently.
description_ar: يهدف هذا البرنامج التدريبي إلى تمكين المشاركين من اكتساب مهارات عملية في التعامل مع البيانات
  باستخدام الجداول الإلكترونية، بأسلوب تطبيقي مبسط لا يتطلب أي خبرة برمجية. يركز البرنامج على أساسيات
  تنظيم البيانات وإدخالها بشكل صحيح، واستخدام الصيغ والدوال الأساسية، وتنظيف البيانات وتجهيزها، ثم الانتقال
  إلى الفرز والتصفية وتلخيص البيانات بالجداول المحورية وإنشاء الرسوم البيانية الواضحة. ويطبق المشاركون
  هذه المهارات عبر تمارين عملية متدرجة على بيانات واقعية تنتهي بإعداد تقرير بيانات بسيط ومتكامل، بما يمكنهم
  من إنجاز مهام البيانات اليومية في أعمالهم بكفاءة وثقة.
learning_outcomes:
- Work confidently with the spreadsheet interface and organise data in it correctly.
- Use basic formulas and functions to perform calculations on data.
- Clean and prepare data for analysis by detecting and fixing errors and duplicates.
- Apply sorting and filtering to organise data and extract the required information.
- Summarise data using pivot tables to draw quick insights.
- Create clear charts that present data in an understandable and engaging way.
- Prepare a simple practical data report that brings together the acquired skills on realistic data.
