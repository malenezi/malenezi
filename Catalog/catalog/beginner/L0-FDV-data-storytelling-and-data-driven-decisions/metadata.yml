learning_outcomes:
- Understand the concept of data storytelling and its importance in communicating insights and supporting
  decisions.
- Turn numbers and results into a clear message suited to the target audience.
- Choose the right chart for each type of data and message.
- Design clear visuals that are free of clutter and misleading elements.
- Build a complete data story that moves from context to insight to recommendation.
- Present data-based insights with confidence to colleagues and decision-makers.
- Apply the principles of data-driven decision-making in everyday work situations.
topics:
