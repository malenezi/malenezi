- Designing Clear Visuals
- Building the Data Story
- Presenting Insights to Decision-Makers
- Data-Driven Decision-Making
topic_details:
  Introduction to Data Storytelling:
  - Understand the concept of data storytelling and the difference between showing numbers and delivering
    a message.
  - Review realistic examples of successful data stories that influenced business decisions.
  - 'Understand the three elements of a data story: data, visuals, and narrative.'
  From Numbers to Message:
  - Practise extracting the key idea from a set of results and figures.
  - Analyse the target audience and identify what matters to them in the data being presented.
  - Craft a clear, concise message that sums up what the data is saying.
  Choosing the Right Chart:
  - Learn the common chart types and the purpose of each one.
  - Practise matching the chart type to the nature of the data and the message to be delivered.
  - Discuss examples of good and poor chart choices.
  Designing Clear Visuals:
  - Apply basic design principles of simplifying, highlighting, and arranging visual elements.
  - Practise improving cluttered charts to make them clearer and easier to read.
  - Recognise misleading practices in presenting data and how to avoid them.
  Building the Data Story:
  - Practise structuring a complete data story from context to insight to recommendation.
  - Arrange visuals and messages in a logical sequence that leads the audience to the conclusion.
  - Complete a practical exercise building a short data story from a realistic dataset.
  Presenting Insights to Decision-Makers:
  - Practise delivering the data story verbally in a clear and compelling way.
  - Handle audience questions and objections about the data and conclusions.
  - Receive feedback and improve the presentation based on it.
  Data-Driven Decision-Making:
  - Understand the steps of data-driven decision-making from question to choice.
  - Practise evaluating options using evidence and numbers rather than impressions.
  - Discuss practical cases of work decisions whose outcomes improved by relying on data.
