description: A hands-on module for engineering applications on top of LLM APIs and open-weight models.
  Participants design prompt pipelines, structured outputs, function calling, and evaluation harnesses,
  and architect complete LLM-powered products. It establishes the engineering discipline behind reliable
  generative-AI software.
description_ar: وحدة تطبيقية لهندسة التطبيقات فوق واجهات النماذج اللغوية الكبيرة والنماذج مفتوحة الأوزان.
  يصمم المشاركون خطوط الأوامر والمخرجات المهيكلة واستدعاء الوظائف ومنصات التقييم ويبنون منتجات متكاملة
  مدعومة بالنماذج اللغوية، بما يرسّخ الانضباط الهندسي وراء برمجيات الذكاء التوليدي الموثوقة.
learning_outcomes:
- Design application architectures around LLM APIs and open-weight models
- Implement structured outputs, function calling, and tool integration
- Develop robust prompt pipelines with templating and guardrails
- Build evaluation harnesses to measure quality, safety, and regression
- Optimize latency and token cost across model and caching choices
- Compare commercial and open-weight models for a given use case
topics:
- LLM application architecture patterns
- Working with LLM APIs and open-weight models
- Structured outputs and function calling
- Prompt pipelines, templating, and guardrails
- 'LLM evaluation: golden sets, LLM-as-judge, metrics'
- Cost, latency, and caching strategies
- Building a complete LLM-powered application
assessment: Labs; LLM application project with evaluation report
