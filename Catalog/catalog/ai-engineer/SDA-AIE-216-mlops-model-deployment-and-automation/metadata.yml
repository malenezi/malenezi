description: A comprehensive module on operationalising machine learning. Participants build reproducible
  training pipelines, register and version models and data, deploy scalable serving endpoints, and automate
  retraining with monitoring for drift. The module establishes the MLOps backbone that Expert-level reliability
  and LLMOps modules extend.
description_ar: وحدة شاملة في تشغيل تعلم الآلة. يبني المشاركون خطوط تدريب قابلة للتكرار ويسجلون النماذج
  والبيانات بإصدارات ويطلقون نقاط خدمة قابلة للتوسع ويؤتمتون إعادة التدريب مع مراقبة الانحراف، بما يؤسس
  العمود الفقري لعمليات تعلم الآلة الذي تبني عليه وحدات الموثوقية وLLMOps للخبراء.
learning_outcomes:
- Design end-to-end MLOps architectures spanning training, serving, and monitoring
- Implement reproducible pipelines with data and model versioning
- Deploy models as scalable, containerised inference services
- Develop automated retraining and CI/CD/CT workflows
- Implement monitoring for data drift, concept drift, and performance decay
- Evaluate deployment strategies including canary, blue-green, and shadow releases
topics:
- MLOps maturity model and system architecture
- Experiment tracking and model registry
- Data versioning and feature stores
- Pipeline orchestration and automation
- 'Model serving: batch, online, streaming'
- Drift detection and monitoring
- Release strategies and rollback
- MLOps platform project
assessment: Labs; deployed pipeline project
next_modules: SDA-AIE-312
stackability: MLOps badge; prerequisite for LLMOps and reliability modules.
