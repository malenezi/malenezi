description: A specialist module for building production computer-vision capabilities. Participants develop
  image classification, object detection, and segmentation solutions using modern architectures and transfer
  learning. The module emphasises dataset curation, augmentation, and deployment of vision models to real
  applications.
description_ar: وحدة تخصصية لبناء قدرات الرؤية الحاسوبية الإنتاجية. يطور المشاركون حلول تصنيف الصور واكتشاف
  الكائنات والتجزئة باستخدام المعماريات الحديثة والتعلم بالنقل، مع تركيز على تنسيق مجموعات البيانات والتعزيز
  ونشر نماذج الرؤية في تطبيقات حقيقية.
learning_outcomes:
- Implement image classification pipelines using CNNs and vision transformers
- Develop object-detection and segmentation solutions with modern frameworks
- Design dataset curation, labelling, and augmentation strategies
- Apply transfer learning and fine-tuning to domain-specific vision tasks
- Evaluate vision models using appropriate metrics such as mAP and IoU
- Deploy optimised vision models to cloud and edge targets
topics:
- Image data, preprocessing, and augmentation
- CNN architectures and vision transformers
- Object detection with YOLO-family models
- Semantic and instance segmentation
- Dataset curation and annotation workflows
- Model evaluation for vision tasks
- Deployment and edge optimisation
- Vision application project
assessment: Labs; vision-system project
