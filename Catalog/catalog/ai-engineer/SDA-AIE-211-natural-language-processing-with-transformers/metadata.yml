description: A specialist module on modern NLP built around the transformer architecture. Participants
  tokenise and model text, fine-tune pretrained transformers for classification and extraction tasks,
  and handle Arabic-language processing challenges. The module bridges classic NLP pipelines and today's
  LLM-centric stack.
description_ar: وحدة تخصصية في معالجة اللغة الطبيعية الحديثة مبنية حول معمارية المحولات. يتعامل المشاركون
  مع الترميز ونمذجة النصوص وضبط المحولات المدربة مسبقًا لمهام التصنيف والاستخراج مع معالجة تحديات اللغة
  العربية، وتجسر الوحدة بين خطوط المعالجة الكلاسيكية ومنظومة النماذج اللغوية الحديثة.
learning_outcomes:
- Implement text-preprocessing and tokenisation pipelines including Arabic-specific handling
- Explain attention mechanisms and the transformer architecture
- Fine-tune pretrained transformer models for classification, NER, and QA tasks
- Develop embedding-based semantic search and similarity applications
- Evaluate NLP models with task-appropriate metrics and error analysis
- Optimize inference speed and memory for transformer deployment
topics:
- Text processing, tokenisation, and embeddings
- Attention and the transformer architecture
- Fine-tuning BERT-family models for downstream tasks
- 'Arabic NLP: challenges, models, and resources'
- Semantic search with sentence embeddings
- Evaluation and error analysis for NLP
- Inference optimisation and serving
assessment: Labs; Arabic/English NLP application project
