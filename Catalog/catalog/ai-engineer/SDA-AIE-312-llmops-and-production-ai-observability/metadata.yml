description: An expert module on operating LLM and generative-AI workloads in production. Participants
  implement tracing, quality monitoring, feedback loops, and incident response for AI services, extending
  MLOps discipline to non-deterministic systems. The module covers evaluation-in-production, prompt/version
  management, and reliability engineering for AI platforms.
description_ar: وحدة خبراء في تشغيل أحمال النماذج اللغوية والذكاء التوليدي في الإنتاج. يطبق المشاركون
  التتبع ومراقبة الجودة وحلقات التغذية الراجعة والاستجابة للحوادث لخدمات الذكاء الاصطناعي، بما يمد انضباط
  MLOps إلى الأنظمة غير الحتمية، وتغطي الوحدة التقييم في الإنتاج وإدارة إصدارات الأوامر وهندسة الموثوقية
  لمنصات الذكاء الاصطناعي.
learning_outcomes:
- Design observability architectures for LLM applications with distributed tracing
- Implement online evaluation, quality scoring, and user-feedback loops
- Develop prompt and model version-management workflows with safe rollouts
- Analyze production incidents in AI systems and build response runbooks
- Implement SLOs, alerting, and reliability dashboards for AI services
- Optimize the operations lifecycle for continuous improvement of deployed LLM systems
topics:
- 'From MLOps to LLMOps: what changes'
- Tracing and logging for LLM pipelines
- Online evaluation and quality monitoring
- Prompt registries and version management
- Feedback loops and data flywheels
- SLOs, alerting, and incident response
- Reliability engineering for AI platforms
assessment: Labs; observability dashboard project
next_modules: SDA-AIE-314 / SDA-AIE-390
stackability: Expert operations badge; part of the MLOps & Reliability specialisation.
