description: A practical introduction to neural networks that takes engineers from backpropagation mechanics
  to training real models on GPUs. Participants build, train, and debug networks in PyTorch, apply transfer
  learning, and manage experiments professionally. It is the gateway to NLP, computer vision, and generative-AI
  specialisations.
description_ar: مدخل عملي للشبكات العصبية ينقل المهندسين من آليات الانتشار الخلفي إلى تدريب نماذج حقيقية
  على وحدات معالجة الرسومات. يبني المشاركون الشبكات ويدربونها ويصححونها في PyTorch مع تطبيق التعلم بالنقل
  وإدارة التجارب باحترافية، وهي بوابة تخصصات معالجة اللغة والرؤية الحاسوبية والذكاء التوليدي.
learning_outcomes:
- Explain neural-network architectures, activation functions, and backpropagation
- Implement feed-forward, convolutional, and recurrent networks in PyTorch
- Develop robust training loops with proper loss functions and optimisers
- Apply regularisation, normalisation, and learning-rate scheduling to stabilise training
- Implement transfer learning with pretrained models for new tasks
- Track, compare, and reproduce experiments using experiment-management tools
topics:
- Neural networks, activations, and backpropagation
- PyTorch tensors, autograd, and training loops
- CNNs for images; RNNs and sequence basics
- Regularisation, normalisation, and optimisation
- Transfer learning and pretrained models
- GPU training and experiment tracking
- 'Lab: build and tune an image classifier'
assessment: Labs; model-training project
