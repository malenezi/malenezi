description: The integrative capstone of the AI Engineer pathway. Teams scope, design, build, secure,
  and deploy a complete generative-AI system — combining RAG or agents, MLOps automation, observability,
  and guardrails — for a realistic enterprise brief. Work is assessed through a production demo, security
  review, and architecture defence before an expert panel.
description_ar: المشروع التكاملي الختامي لمسار مهندس الذكاء الاصطناعي. تتولى الفرق تحديد نطاق نظام ذكاء
  توليدي متكامل وتصميمه وبنائه وتأمينه ونشره — يجمع بين RAG أو الوكلاء وأتمتة MLOps والمراقبة والحواجز
  الوقائية — وفق موجز مؤسسي واقعي، ويُقيَّم العمل عبر عرض إنتاجي ومراجعة أمنية ودفاع معماري أمام لجنة
  خبراء.
learning_outcomes:
- Design a complete production architecture for an enterprise GenAI use case
- Implement an integrated system combining retrieval, agents, and serving infrastructure
- Develop automated evaluation, monitoring, and guardrail layers
- Validate the system through security testing and load benchmarks
- Optimize cost and performance against defined service objectives
- Defend design decisions and results before a technical panel
topics:
- Project scoping and requirements engineering
- System design and architecture review
- Sprint-based build with mentor checkpoints
- Evaluation, security, and performance hardening
- Deployment and operations readiness
- Final demo, documentation, and panel defence
assessment: Deployed system; documentation package; panel defence
