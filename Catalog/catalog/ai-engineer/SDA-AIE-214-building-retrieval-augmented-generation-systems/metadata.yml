description: A deep, practical module on grounding LLMs in enterprise knowledge. Participants build the
  full RAG pipeline — ingestion, chunking, embedding, vector retrieval, reranking, and generation — and
  evaluate answer faithfulness systematically. The module covers advanced patterns including hybrid search
  and multi-document reasoning for production-grade assistants.
description_ar: وحدة عملية متعمقة في تأصيل النماذج اللغوية بمعرفة المؤسسة. يبني المشاركون خط RAG الكامل
  من الاستيعاب والتقطيع والتضمين والاسترجاع المتجهي وإعادة الترتيب إلى التوليد، مع تقييم منهجي لأمانة
  الإجابات، وتغطي الوحدة أنماطًا متقدمة تشمل البحث الهجين والاستدلال متعدد المستندات للمساعدات الإنتاجية.
learning_outcomes:
- Design end-to-end RAG architectures for enterprise knowledge bases
- Implement ingestion, chunking, and embedding pipelines for heterogeneous documents
- Develop retrieval stacks combining vector, keyword, and hybrid search with reranking
- Evaluate RAG quality using faithfulness, relevance, and answer-correctness metrics
- Optimize retrieval parameters, context construction, and citation grounding
- Validate systems against hallucination and stale-knowledge failure modes
topics:
- RAG architecture and when to use it versus fine-tuning
- Document ingestion, parsing, and chunking strategies
- Embeddings and vector databases
- Hybrid retrieval and reranking
- Context construction and citation grounding
- RAG evaluation frameworks
- 'Advanced patterns: multi-hop, agentic RAG'
- Production RAG project
assessment: Labs; enterprise RAG project with evaluation
