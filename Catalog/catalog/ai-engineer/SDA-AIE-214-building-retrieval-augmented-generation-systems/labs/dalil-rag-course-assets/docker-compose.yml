# Qdrant for the labs. Pinned, because "latest" is how a cohort discovers a
# breaking API change at 09:05 on Day 2.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: dalil-qdrant
    ports:
      - "6333:6333"     # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334"     # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  qdrant_storage:
