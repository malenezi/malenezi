  - id: genai-guideline-government
    title_en: Generative AI Guidelines for Government
    title_ar: أدلة الذكاء الاصطناعي التوليدي للجهات الحكومية
    authority: SDAIA
    doc_class: guideline
    department: ai_governance
    access_tier: public
    lifecycle: current
    languages: [ar, en]
    url_candidates:
      - https://sdaia.gov.sa/en/SDAIA/about/Documents/GenAI-Government.pdf
    discovery: RegulationsAndPolicies
    teaches: [self-referential-rag-governance, classification-crossref]
    golden_set_share: 0.06
    notes: >
      Pedagogically delicious: participants build a RAG system whose corpus
      contains the rules governing the RAG system they are building. Used in
      the Module 5 access-control discussion and the capstone governance memo.

  - id: genai-guideline-public
    title_en: Generative AI Guidelines for the Public
    title_ar: أدلة الذكاء الاصطناعي التوليدي للعموم
    authority: SDAIA
    doc_class: guideline
    department: ai_governance
    access_tier: public
    lifecycle: current
    languages: [ar, en]
    url_candidates:
      - https://sdaia.gov.sa/en/SDAIA/about/Documents/GenAI-Public.pdf
    discovery: RegulationsAndPolicies
    teaches: [near-duplicate-confusion-with-government-edition]
    golden_set_share: 0.03
    notes: >
      Second half of the second near-duplicate pair. Questions must specify
      *which* audience edition — a superb query-ambiguity teaching case.

  - id: ai-adoption-framework
    title_en: AI Adoption Framework
    title_ar: إطار تبني الذكاء الاصطناعي
    authority: SDAIA
    doc_class: framework
    department: ai_governance
    access_tier: public
    lifecycle: current
