  # --------------------------------------------------------- workforce tier
  - id: national-occupational-standards-data-ai
    title_en: National Occupational Standards Framework for Data and AI
    title_ar: الإطار الوطني للمعايير المهنية للبيانات والذكاء الاصطناعي
