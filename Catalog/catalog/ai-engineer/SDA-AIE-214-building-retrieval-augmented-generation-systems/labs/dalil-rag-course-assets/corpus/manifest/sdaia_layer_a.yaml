# ----------------------------------------------------------------------------
# Coverage targets the validator enforces (validate_corpus.py --strict)
# ----------------------------------------------------------------------------
targets:
  min_documents_resolved: 10          # below this, fall back to Layer B only
  min_bilingual_pairs: 6              # AR+EN editions of the same document
  min_total_pages: 300
  require_at_least_one_table_doc: true
  require_at_least_one_near_duplicate_pair: true
