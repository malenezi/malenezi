    golden_set_share: 0.04

  # ------------------------------------------------------------------ AI tier
  - id: ai-ethics-principles
    title_en: AI Ethics Principles
    title_ar: مبادئ أخلاقيات الذكاء الاصطناعي
    authority: SDAIA
    doc_class: principles
