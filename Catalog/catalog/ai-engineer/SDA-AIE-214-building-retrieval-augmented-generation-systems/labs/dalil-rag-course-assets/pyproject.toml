[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dalil"
version = "1.0.0"
description = "Dalil — the golden-thread RAG system of SDA-AIE-214 (SDAIA Academy)"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pillow>=10.0",
]

[project.optional-dependencies]
# The labs' real stack. Split out so `pip install -e .` stays fast and the
# tests run on a machine with no GPU, no models and no vector database.
full = [
  "sentence-transformers>=3.0",
  "qdrant-client>=1.12",
  "fastembed>=0.4",
  "FlagEmbedding>=1.3",
  "openai>=1.40",
  "ragas>=0.2",
  "datasets>=2.20",
  "trafilatura>=1.12",
  "pytesseract>=0.3.10",
  "arabic-reshaper>=3.0",
  "python-bidi>=0.4",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
ignore = ["E501"]
