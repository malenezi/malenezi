description: An expert module on engineering AI systems that are fast, scalable, and economical. Participants
  profile inference workloads, apply batching, caching, quantisation, and routing strategies, and design
  autoscaling serving infrastructure. The module builds the FinOps discipline to run national-scale AI
  services within budget.
description_ar: وحدة خبراء في هندسة أنظمة ذكاء اصطناعي سريعة وقابلة للتوسع واقتصادية. يحلل المشاركون أحمال
  الاستدلال ويطبقون استراتيجيات التجميع والتخزين المؤقت والتكميم والتوجيه ويصممون بنية خدمة ذاتية التوسع،
  مع بناء انضباط FinOps لتشغيل خدمات ذكاء اصطناعي وطنية ضمن الميزانية.
learning_outcomes:
- Analyze latency, throughput, and cost profiles of AI inference workloads
- Implement batching, caching, and streaming optimisations for model serving
- Apply quantisation, distillation, and model-routing to cut serving costs
- Design autoscaling GPU infrastructure for variable demand
- Evaluate build-versus-buy and model-tier trade-offs with TCO analysis
- Develop cost-monitoring dashboards and optimisation playbooks
topics:
- Performance profiling of inference workloads
- 'Serving optimisation: batching, caching, streaming'
- 'Model compression: quantisation and distillation'
- Model routing and cascade architectures
- GPU infrastructure and autoscaling
- 'AI FinOps: cost monitoring and TCO'
- Optimisation project on a live workload
assessment: Optimisation project with before/after benchmark
