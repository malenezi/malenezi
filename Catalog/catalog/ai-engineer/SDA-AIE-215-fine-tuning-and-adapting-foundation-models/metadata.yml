description: A specialist module on customising foundation models efficiently. Participants prepare instruction
  datasets, apply parameter-efficient fine-tuning (LoRA/QLoRA), align models with preference optimisation,
  and quantise them for deployment. The module gives engineers a decision framework for when to prompt,
  retrieve, or fine-tune.
description_ar: وحدة تخصصية في تخصيص النماذج الأساسية بكفاءة. يجهّز المشاركون بيانات التعليمات ويطبقون
  الضبط الدقيق الموفر للمعاملات (LoRA/QLoRA) ومواءمة النماذج بتحسين التفضيلات وتكميمها للنشر، وتمنح الوحدة
  المهندسين إطار قرار للاختيار بين الأوامر أو الاسترجاع أو الضبط الدقيق.
learning_outcomes:
- Compare prompting, RAG, and fine-tuning strategies for a given requirement
- Design high-quality instruction and preference datasets
- Implement parameter-efficient fine-tuning using LoRA and QLoRA
- Apply quantisation techniques to reduce model footprint
- Evaluate fine-tuned models against baselines with rigorous benchmarks
- Validate adapted models for regression, safety, and domain fitness
topics:
- 'Adaptation strategy: prompt vs RAG vs fine-tune'
- Instruction dataset design and curation
- 'PEFT methods: LoRA, QLoRA, adapters'
- Preference alignment (DPO) overview
- Quantisation and efficient inference
- Evaluation and regression testing of tuned models
assessment: Labs; domain fine-tuning project
