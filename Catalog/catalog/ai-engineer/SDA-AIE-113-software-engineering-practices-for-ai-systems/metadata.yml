  نظيفة حول النماذج ويحوّلون الخدمات إلى حاويات باستخدام Docker ويؤتمتون الاختبارات وخطوط CI/CD وينظمون
  قواعد الكود لقابلية الصيانة، وهي ممارسات تؤسس لكل وحدات النشر اللاحقة.
learning_outcomes:
- Design RESTful APIs that expose ML models as reliable services
- Implement containerised AI services using Docker and compose workflows
- Develop automated unit, integration, and model-behaviour tests
- Build CI/CD pipelines that validate and ship AI code changes
- Apply clean-architecture and configuration-management patterns to AI codebases
- Evaluate code quality using reviews, linting, and static analysis
topics:
- Structuring AI projects and clean architecture
- APIs for model serving with FastAPI
- Docker and containerised services
- Testing strategies for ML code
- CI/CD automation with GitHub Actions
- Configuration, secrets, and logging practices
assessment: Labs; containerised model-service project
