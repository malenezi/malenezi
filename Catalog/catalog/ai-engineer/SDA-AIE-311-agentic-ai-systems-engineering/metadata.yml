description: An expert module on designing, building, securing, and operating enterprise agentic systems
  that plan, reason, use tools, and manage memory across multi-step workflows. Participants implement
  ReAct, Plan-and-Execute, and Reflection patterns, orchestrate multi-agent architectures, integrate tools
  via the Model Context Protocol, and harden agents with guardrails and red-team testing. The module culminates
  in deploying a production-grade agentic system in a simulated enterprise environment.
description_ar: وحدة خبراء في تصميم وبناء وتأمين وتشغيل أنظمة وكيلية مؤسسية قادرة على التخطيط والاستدلال
  واستخدام الأدوات وإدارة الذاكرة عبر سير عمل متعدد الخطوات. يطبق المشاركون أنماط ReAct وPlan-and-Execute
  وReflection وينسقون معماريات متعددة الوكلاء ويدمجون الأدوات عبر بروتوكول MCP ويحصّنون الوكلاء بالحواجز
  الوقائية واختبارات الفريق الأحمر، وتُختتم الوحدة بنشر نظام وكيلي بمستوى إنتاجي في بيئة مؤسسية محاكاة.
learning_outcomes:
- Design agentic architectures with planning, reasoning, tool use, and memory
- Implement ReAct, Plan-and-Execute, and Reflection patterns in working agents
- Develop multi-agent systems with orchestration, delegation, and task routing
- Integrate tools and enterprise APIs using the Model Context Protocol
- Design state management and short/long-term memory with vector stores
- Implement automated guardrails and red-team agents against attacks
- Optimize agent performance, cost, and reliability with tracing and monitoring
- Validate a deployed agentic system in a simulated enterprise environment
topics:
- Agentic system architectures and components
- 'Planning and reasoning patterns: ReAct, Plan-and-Execute, Reflection'
- Tool use, function calling, and MCP integration
- Memory and state management with vector databases
- Single-agent versus multi-agent architectures
- Hierarchical delegation and agent orchestration
- Flow engineering over prompt engineering
- Guardrails, security, and adversarial testing
- Observability, cost optimisation, and monitoring
- 'Capstone: enterprise agentic system deployment'
assessment: Labs; security report; deployed agent capstone
next_modules: SDA-AIE-313 / SDA-AIE-390
