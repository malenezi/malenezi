description: An expert module on securing AI systems against adversarial threats. Participants analyse
  attack surfaces including prompt injection, jailbreaks, data poisoning, and model extraction, then design
  layered defences with guardrails, filtering, and access controls. Structured red-team exercises teach
  systematic security validation of LLM and agentic applications.
description_ar: وحدة خبراء في تأمين أنظمة الذكاء الاصطناعي ضد التهديدات العدائية. يحلل المشاركون أسطح
  الهجوم بما فيها حقن الأوامر وكسر القيود وتسميم البيانات واستخراج النماذج، ثم يصممون دفاعات متعددة الطبقات
  بالحواجز الوقائية والتصفية وضوابط الوصول، مع تمارين فريق أحمر منظمة للتحقق الأمني المنهجي من تطبيقات
  النماذج اللغوية والوكيلية.
learning_outcomes:
- Analyze AI attack surfaces using OWASP LLM Top-10 and threat modelling
- Evaluate systems against prompt injection, jailbreak, and data-exfiltration attacks
- Design layered guardrail architectures for inputs, outputs, and tools
- Implement content filtering, PII protection, and policy enforcement
- Conduct structured red-team exercises against LLM and agentic applications
- Develop security test suites and reporting aligned with governance requirements
topics:
- AI threat landscape and OWASP LLM Top-10
- Prompt injection and jailbreak techniques
- Data poisoning and supply-chain risks
- Guardrail architecture and policy enforcement
- Red-teaming methodology and tooling
- Security evaluation and reporting
- Compliance alignment with national frameworks
assessment: Red-team exercise; security assessment report
next_modules: SDA-AIE-390
stackability: Security badge; required for AI Engineer Expert certificate.
