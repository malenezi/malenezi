description: An expert module that elevates engineers to solution architects. Participants translate business
  requirements into end-to-end AI architectures, select platforms and integration patterns, and produce
  architecture documentation and decision records. Case-based design reviews cover real government and
  enterprise AI scenarios.
description_ar: وحدة خبراء ترتقي بالمهندسين إلى مستوى معماري الحلول. يحوّل المشاركون متطلبات الأعمال إلى
  معماريات ذكاء اصطناعي متكاملة ويختارون المنصات وأنماط التكامل وينتجون وثائق المعمارية وسجلات القرارات،
  مع مراجعات تصميم قائمة على حالات حكومية ومؤسسية حقيقية.
learning_outcomes:
- Translate business requirements into candidate AI solution architectures
- Design integration patterns connecting AI services to enterprise systems
- Evaluate platform, cloud, and sovereignty options against constraints
- Design for security, compliance, and data residency from the outset
- Develop architecture decision records and reference documentation
- Defend architectural choices in structured design reviews
topics:
- AI solution architecture lifecycle
- 'Reference architectures: RAG, agents, ML platforms'
- Enterprise integration and API strategy
- Cloud, on-premise, and sovereignty considerations
- 'Non-functional requirements: security, scale, compliance'
- Architecture documentation and ADRs
- Design-review simulations on real scenarios
assessment: Architecture design package; peer design review
