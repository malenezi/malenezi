description: A hands-on foundation in supervised and unsupervised learning that teaches the complete modelling
  workflow. Participants frame business problems as ML tasks, train and tune models with scikit-learn,
  and evaluate them with the right metrics. The module ends with an end-to-end modelling project on real
  data.
description_ar: أساس تطبيقي في التعلم الخاضع وغير الخاضع للإشراف يغطي سير عمل النمذجة الكامل. يصوغ المشاركون
  المشكلات كمهام تعلم آلة ويدربون النماذج ويضبطونها باستخدام scikit-learn ويقيّمونها بالمقاييس المناسبة،
  وتختتم الوحدة بمشروع نمذجة متكامل على بيانات حقيقية.
learning_outcomes:
- Frame business problems as supervised or unsupervised learning tasks
- Implement the end-to-end ML workflow from data splitting to model selection
- Develop classification and regression models using scikit-learn pipelines
- Apply feature engineering, scaling, and encoding techniques appropriately
- Evaluate models using suitable metrics, cross-validation, and error analysis
- Diagnose and mitigate overfitting, underfitting, and data leakage
- Optimize model performance through systematic hyperparameter tuning
topics:
- ML problem framing and workflow design
- 'Supervised learning: regression and classification'
- Feature engineering and preprocessing pipelines
- Model evaluation, metrics, and cross-validation
- 'Tree ensembles: random forests and gradient boosting'
- 'Unsupervised learning: clustering and dimensionality reduction'
- Hyperparameter tuning and model selection
- End-to-end modelling project
assessment: Daily labs; end-to-end ML project
next_modules: SDA-AIE-112
