    تدعم اتخاذ القرارات في بيئة العمل، بأسلوب عملي مبسط لا يتطلب خلفية تقنية. يركز البرنامج على أساسيات سرد البيانات
    وصياغة الرسالة المناسبة للجمهور المستهدف، واختيار الرسوم البيانية الملائمة وتصميم عروض بصرية واضحة وخالية من
    التضليل، إضافة إلى بناء قصة بيانات متكاملة تتدرج من السياق إلى الرؤية إلى التوصية. كما يتناول البرنامج مبادئ
    اتخاذ القرارات المبنية على البيانات وتقييم الخيارات بموضوعية، مع تدريبات عملية على عرض الرؤى أمام الزملاء ومتخذي
    القرار، ويخرج المشاركون بقدرة عملية على إيصال نتائج البيانات بثقة وتأثير.
