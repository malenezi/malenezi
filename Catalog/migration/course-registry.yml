  - Identify practical opportunities to apply AI tools to daily job tasks.
  - Use ready-made AI assistants to complete simple work tasks without any programming.
  - Recognise the limitations and common errors of AI tools and verify the accuracy of their outputs.
  - Apply safe and responsible practices when using AI in the work environment.
