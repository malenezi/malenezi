# oauth2-proxy — Microsoft Entra ID (SDAIA tenant). Replace every <…> value.
# Generic OIDC against Entra ID. Enable the "groups" claim in the app registration
# (Token configuration → Add groups claim → Security groups).
provider = "oidc"
oidc_groups_claim = "groups"
oidc_issuer_url = "https://login.microsoftonline.com/<TENANT_ID>/v2.0"
# Only members of these Entra ID groups (object IDs) may enter.
allowed_groups = ["<ACADEMY_TRAINERS_GROUP_ID>", "<ACADEMY_CONTENT_GROUP_ID>"]
email_domains = ["sdaia.gov.sa"]
upstreams = ["http://portal:80/"]
https_address = ":4443"
tls_cert_file = "/etc/tls/tls.crt"
tls_key_file = "/etc/tls/tls.key"
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "12h"
skip_provider_button = true
reverse_proxy = false
