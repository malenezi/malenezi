# Trainer Portal — internal hosting behind SDAIA single sign-on.
# nginx serves the static site built by `make portal`; oauth2-proxy enforces Entra ID sign-in
# and group membership before any request reaches nginx.
# Secrets come from the host environment / secret store — never commit them.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0   # pin and update through change control
    command: --config=/etc/oauth2-proxy.cfg
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${ENTRA_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}      # 32-byte random, base64
    volumes:
      - ./oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
    ports:
      - "443:4443"
    depends_on: [portal]
    restart: unless-stopped
  portal:
    image: nginx:1.27-alpine
    volumes:
      - ${DEPLOY_PATH:-/srv/trainer-portal/site}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["80"]
    restart: unless-stopped
